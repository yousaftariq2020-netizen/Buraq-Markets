<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buraq Markets — Forgot Password</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#070707;color:#fff;font-family:Inter,Arial,sans-serif;display:grid;place-items:center}
.box{width:min(420px,calc(100% - 30px));background:#15151b;border:1px solid #5b4725;border-radius:14px;padding:35px}
.brand{font:bold 23px Georgia,serif;color:#f4cf72}
.eyebrow{color:#f4cf72;font-size:11px;letter-spacing:3px;margin-top:25px;font-weight:700}
.box h1{font:normal 28px Georgia,serif;margin:10px 0 8px}
.sub{color:#aaa;font-size:13px;line-height:1.5;margin:0 0 22px}
.field{margin:15px 0}
.field label{display:block;font-size:11px;font-weight:700;margin-bottom:7px;color:#ddd}
.field input{width:100%;padding:13px;background:#09090c;border:1px solid #36353c;border-radius:7px;color:#fff;outline:0}
.field input:focus{border-color:#d6a93b}
.btn{width:100%;padding:13px;background:linear-gradient(#f4cc6c,#dca83c);border:0;border-radius:7px;font-weight:700;cursor:pointer;font-size:14px}
.btn:disabled{opacity:.6;cursor:not-allowed}
.back{display:block;text-align:center;margin-top:18px;color:#aaa;font-size:12px;text-decoration:none}
.back:hover{color:#f4cf72}
.msg{font-size:13px;margin:14px 0;padding:12px;border-radius:8px;display:none;line-height:1.5}
.msg.error{display:block;background:#2a1212;border:1px solid #5b2929;color:#ff8b8b}
.msg.success{display:block;background:#0d2418;border:1px solid #1b5a39;color:#8ee0a5}
</style>
<!-- EmailJS Library -->
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body>
<div class="box">
  <div class="brand">BURAQ MARKETS</div>
  <div class="eyebrow">ACCOUNT RECOVERY</div>
  <h1>Forgot Password</h1>
  <p class="sub">Enter your registered email. We will send you a secure link to reset your password.</p>
  <form id="resetForm">
    <div class="field">
      <label>Email Address</label>
      <input id="email" required type="email" placeholder="Enter registered email">
    </div>
    <div class="msg" id="msg"></div>
    <button class="btn" id="btn" type="submit">Send Reset Link →</button>
  </form>
  <a class="back" href="client-login.html">← Back to Login</a>
</div>

<script type="module">
import { supabase } from './supabase-config.js';

// EmailJS Initialization (Apni PUBLIC KEY yahan daalein)
emailjs.init("YOUR_EMAILJS_PUBLIC_KEY");

const form = document.getElementById('resetForm');
const btn = document.getElementById('btn');
const msg = document.getElementById('msg');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  msg.className = 'msg';
  msg.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Sending…';

  const userEmail = document.getElementById('email').value.trim();

  // 1. Supabase Reset Link Trigger (Taake Auth token generate ho sakay)
  const { data, error } = await supabase.auth.resetPasswordForEmail(userEmail, {
    redirectTo: `${window.location.origin}/update-password.html`,
  });

  if (error) {
    msg.textContent = error.message;
    msg.className = 'msg error';
    msg.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Send Reset Link →';
    return;
  }

  // 2. EmailJS ke zariya reset notification bhejna
  const resetUrl = `${window.location.origin}/update-password.html`;

  emailjs.send("YOUR_SERVICE_ID", "YOUR_TEMPLATE_ID", {
    to_email: userEmail,
    reset_link: resetUrl
  }).then(() => {
    msg.textContent = 'Reset link aapke email address par bhej diya gaya hai!';
    msg.className = 'msg success';
    msg.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Send Reset Link →';
    form.reset();
  }).catch((err) => {
    msg.textContent = 'Email send karne me error aaya: ' + err.text;
    msg.className = 'msg error';
    msg.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Send Reset Link →';
  });
});
</script>
</body>
</html>

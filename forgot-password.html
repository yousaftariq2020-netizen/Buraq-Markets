<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buraq Markets — Update Password</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#070707;color:#fff;font-family:Inter,Arial,sans-serif;display:grid;place-items:center}
.box{width:min(420px,calc(100% - 30px));background:#15151b;border:1px solid #5b4725;border-radius:14px;padding:35px}
.brand{font:bold 23px Georgia,serif;color:#f4cf72}
.eyebrow{color:#f4cf72;font-size:11px;letter-spacing:3px;margin-top:25px;font-weight:700}
.box h1{font:normal 28px Georgia,serif;margin:10px 0 8px}
.sub{color:#aaa;font-size:13px;line-height:1.5;margin:0 0 22px}
.field{margin:15px 0}
.field label{display:block;font-size:11px;font-weight:700;margin-bottom:7px;color:#ddd}
.field input{width:100%;padding:13px;background:#09090c;border:1px solid #36353c;border-radius:7px;color:#fff;outline:0}
.field input:focus{border-color:#d6a93b}
.btn{width:100%;padding:13px;background:linear-gradient(#f4cc6c,#dca83c);border:0;border-radius:7px;font-weight:700;cursor:pointer;font-size:14px}
.btn:disabled{opacity:.6;cursor:not-allowed}
.msg{font-size:13px;margin:14px 0;padding:12px;border-radius:8px;display:none;line-height:1.5}
.msg.error{display:block;background:#2a1212;border:1px solid #5b2929;color:#ff8b8b}
.msg.success{display:block;background:#0d2418;border:1px solid #1b5a39;color:#8ee0a5}
</style>
</head>
<body>
<div class="box">
  <div class="brand">BURAQ MARKETS</div>
  <div class="eyebrow">NEW PASSWORD</div>
  <h1>Set New Password</h1>
  <p class="sub">Please enter your new secure password below.</p>
  
  <form id="updatePasswordForm">
    <div class="field">
      <label>New Password</label>
      <input id="newPassword" type="password" required minlength="6" placeholder="Enter new password">
    </div>
    <div class="msg" id="msg"></div>
    <button class="btn" id="btn" type="submit">Update Password →</button>
  </form>
</div>

<script type="module">
import { supabase } from './supabase-config.js';

const form = document.getElementById('updatePasswordForm');
const btn = document.getElementById('btn');
const msg = document.getElementById('msg');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  msg.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Updating…';

  const newPassword = document.getElementById('newPassword').value;

  const { error } = await supabase.auth.updateUser({ password: newPassword });

  if (error) {
    msg.textContent = error.message;
    msg.className = 'msg error';
    msg.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Update Password →';
  } else {
    msg.textContent = 'Password updated successfully! Redirecting to login...';
    msg.className = 'msg success';
    msg.style.display = 'block';
    setTimeout(() => {
      window.location.href = 'client-login.html';
    }, 2000);
  }
});
</script>
</body>
</html>

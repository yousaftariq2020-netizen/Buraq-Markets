<html lang="en">
<head>

<title>Buraq Markets — Client Dashboard</title>
<style>
:root{--bg:#070b0d;--sidebar:#090f12;--panel:#11181c;--panel2:#0d1417;--border:#202a2e;--text:#f4f7f6;--muted:#8d999d;--green:#18c879;--green2:#0d5a3b;--gold:#d6a93b;--blue:#4aa8ff;--purple:#9b68ff;--red:#ff5360}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 75% 0%,#10221a 0,transparent 28%),var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;font-size:14px}a{text-decoration:none;color:inherit}button{font:inherit}
.layout{min-height:100vh;display:flex}.sidebar{width:248px;position:fixed;inset:0 auto 0 0;background:linear-gradient(180deg,#0b1216,#070b0d);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:40;transform:translateX(-105%);transition:transform .24s ease;box-shadow:18px 0 45px rgba(0,0,0,.28);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;height:100%;max-height:100dvh;overscroll-behavior:contain;touch-action:pan-y}.sidebar.open{transform:translateX(0)}.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.58);backdrop-filter:blur(2px);z-index:35;opacity:0;visibility:hidden;transition:opacity .2s ease,visibility .2s ease}.sidebar-overlay.show{opacity:1;visibility:visible}.main{margin-left:0;min-width:0;flex:1}.logo-wrap{height:96px;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:14px 22px;border-bottom:1px solid var(--border)}.logo{width:175px;height:auto;display:block;object-fit:contain}.side-nav{padding:18px 13px;display:flex;flex-direction:column;gap:5px;flex:1 1 auto}.side-link{display:flex;align-items:center;gap:13px;padding:12px 13px;border-radius:99px;color:#b8c1c3;font-size:14px;font-weight:600;transition:.18s;flex-shrink:0;cursor:pointer}.side-link:hover{background:#101b1f;color:#fff}.side-link.active{background:linear-gradient(90deg,#0d5d3d,#10442f);color:#fff;box-shadow:inset 0 0 0 1px #176d49}.ico{width:22px;text-align:center;font-size:18px}.kyc-dot{margin-left:auto;background:#18a968;color:#fff;border-radius:10px;padding:3px 7px;font-size:9px}.side-bottom{margin-top:auto;padding:14px;flex-shrink:0}.help{border:1px solid #263238;background:#0c1418;border-radius:10px;padding:14px;display:flex;gap:11px;align-items:center;color:#aeb8ba}.help strong{display:block;color:#fff;font-size:13px}.help small{display:block;margin-top:4px;color:#778387}.topbar{height:72px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 28px;background:rgba(7,11,13,.95);z-index:10;position:relative}.hamb{font-size:24px;color:#d9e0df;margin-right:22px;border:0;background:transparent;padding:4px;cursor:pointer;line-height:1}.top-title{font-size:20px;font-weight:700}.top-actions{margin-left:auto;display:flex;align-items:center;gap:22px}.circle-btn{width:40px;height:40px;border:1px solid var(--border);border-radius:50%;background:#0d1418;color:#dce4e3;display:grid;place-items:center;cursor:pointer}.bell{position:relative}.bell:after{content:'2';position:absolute;right:-2px;top:-3px;background:#23b86d;color:#fff;border-radius:50%;font-size:9px;min-width:16px;height:16px;display:grid;place-items:center}

.user-dropdown{position:relative;cursor:pointer}.user{display:flex;align-items:center;gap:10px;padding:4px 8px;border-radius:8px;transition:background .2s}.user:hover{background:#11191d}.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#475258,#12181c);display:grid;place-items:center;color:#dfe7e5;font-size:18px;overflow:hidden;object-fit:cover}.user-name{font-weight:700}.user-role{font-size:11px;color:var(--muted);margin-top:3px}.chev{color:#829093;margin-left:8px}
.profile-menu{position:absolute;top:calc(100% + 10px);right:0;width:220px;background:#0d1417;border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.5);display:none;flex-direction:column;padding:8px 0;z-index:100}.profile-menu.show{display:flex}.profile-menu-item{display:flex;align-items:center;gap:10px;padding:10px 16px;color:#cdd5d7;font-size:13px;transition:background .15s;cursor:pointer}.profile-menu-item:hover{background:#172227;color:#fff}.profile-menu-divider{height:1px;background:var(--border);margin:6px 0}
.content{padding:27px 28px 36px;max-width:1450px;margin:auto}.hero{position:relative;overflow:hidden;min-height:160px;border:1px solid #184b37;border-radius:12px;background:linear-gradient(110deg,#062319,#071511 56%,#062219);padding:30px 34px;margin-bottom:18px}.hero:before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 45%,rgba(21,150,96,.13) 45%,transparent 46%,transparent 62%,rgba(21,150,96,.08) 62%,transparent 63%),radial-gradient(circle at 82% 65%,rgba(31,192,120,.18),transparent 32%)}.hero-line{position:absolute;right:-4%;bottom:12px;width:58%;height:100px;opacity:.75;background:linear-gradient(135deg,transparent 0 15%,rgba(32,198,124,.2) 16% 17%,transparent 18% 29%,rgba(32,198,124,.35) 30% 31%,transparent 32% 43%,rgba(32,198,124,.6) 44% 45%,transparent 46% 58%,rgba(32,198,124,.72) 59% 60%,transparent 61% 72%,rgba(32,198,124,.8) 73% 74%,transparent 75%);transform:skewY(-13deg)}.hero-copy{position:relative;z-index:2}.hero small{color:#c8d2cf;font-size:16px}.hero h1{margin:7px 0 4px;font-size:34px;letter-spacing:-.5px}.hero p{margin:0;color:#9eaaa8;font-size:13px}.hero-logo{position:absolute;z-index:2;right:38px;top:25px;width:210px;max-height:110px;object-fit:contain;filter:drop-shadow(0 8px 18px rgba(0,0,0,.4))}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}.kpi{background:linear-gradient(145deg,#11191d,#0d1417);border:1px solid var(--border);border-radius:11px;padding:20px 20px 17px;min-width:0}.kpi-head{display:flex;align-items:center;justify-content:space-between;color:#aab5b7;font-size:12px}.kpi-value{font-size:25px;font-weight:800;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kpi-sub{font-size:11px;color:#768285;margin-top:6px}.kpi-sub.green{color:#2cd17f}
.panel{background:linear-gradient(145deg,#10171b,#0d1316);border:1px solid var(--border);border-radius:12px}.accounts-panel{overflow:hidden}.panel-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px}.panel-title{font-size:18px;font-weight:700}
.panel-head-actions{display:flex;gap:10px;align-items:center}
.btn-primary{background:#11a861;color:#fff;border:1px solid #18c879;border-radius:7px;padding:10px 15px;font-weight:700;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}.btn-primary:hover{background:#16b96d}
.btn-secondary{background:#0d283e;color:#55a9ff;border:1px solid #1c4b75;border-radius:7px;padding:10px 15px;font-weight:700;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}.btn-secondary:hover{background:#123552}
.table-wrap{overflow:auto}.account-table{width:100%;border-collapse:collapse;min-width:880px}.account-table th{padding:12px 20px;text-align:left;color:#7e8a8e;font-size:11px;font-weight:500;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}.account-table td{padding:15px 20px;border-bottom:1px solid #1c2529;color:#d7dddd;font-size:12px;vertical-align:middle}.account-table tr:last-child td{border-bottom:0}.account-main{font-size:15px;font-weight:800;color:#eef4f2}.account-sub{color:#899598;font-size:11px;margin-top:4px}.pill{display:inline-flex;align-items:center;border-radius:5px;padding:6px 9px;font-size:10px;font-weight:700}.live{background:#0d3a27;color:#39dc8b}.demo{background:#082e54;color:#4eafff}.standard{background:#0b355b;color:#5bb5ff}.ecn{background:#2d1849;color:#bd8aff}.active{background:#0d3a27;color:#4de292}.platform{display:flex;align-items:center;gap:7px;font-weight:700}.mt5{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#17c878,#0c7650);display:grid;place-items:center;font-size:11px}.positive{color:#2ddd84;font-weight:700}.manage{background:transparent;border:1px solid #334047;color:#dce4e3;border-radius:7px;padding:8px 12px;font-size:11px;cursor:pointer}.manage:hover{border-color:#4a666e}.empty-row{text-align:center;color:#778487;padding:35px!important}
.quick-panel{margin-top:18px;padding:20px}.quick-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px}.quick{border:1px solid #273238;background:#0c1418;border-radius:99px;padding:16px;display:flex;align-items:center;gap:12px;cursor:pointer}.quick:hover{border-color:#31504a;background:#0e191c}.quick-icon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:18px;flex:0 0 40px}.q-green{background:#0b2b1e;color:#19cf79}.q-red{background:#351318;color:#ff6370}.q-blue{background:#092c47;color:#4aa9ff}.q-purple{background:#29173c;color:#aa74ff}.q-gold{background:#32270d;color:#e8b940}.quick b{display:block;font-size:12px}.quick span{display:block;color:#7f8c90;font-size:10px;margin-top:4px}
.lower{display:grid;grid-template-columns:1.4fr .8fr;gap:15px;margin-top:18px}.lower .panel{padding:20px}.tx-table{width:100%;border-collapse:collapse;font-size:11px}.tx-table th,.tx-table td{padding:11px 7px;border-bottom:1px solid #20292d;text-align:left}.tx-table th{color:#7f8b8f;font-weight:500}.tx-table td{color:#cbd4d3}.statusbadge{display:inline-block;padding:4px 8px;border-radius:20px;font-size:9px;font-weight:700;text-transform:uppercase}.statusbadge.pending{background:#33290d;color:#efc24b;border:1px solid #594811}.statusbadge.green{background:#0d3020;color:#4be090;border:1px solid #1b5a39}.statusbadge.red{background:#351316;color:#ff6d77;border:1px solid #5a1d22}.row{display:flex;justify-content:space-between;gap:15px;padding:11px 0;border-bottom:1px solid #20292d;font-size:11px}.row span{color:#7f8b8f}.row b{color:#dbe3e2;text-align:right}.green-text{color:#2ddd84!important}.red-text{color:#ff6670!important}.gold-text{color:#e3b64e!important}.empty{color:#778487;font-size:12px;padding:20px 0}.loading{padding:80px;text-align:center;color:#9ba6a8}

/* Custom Notification Toast */
.custom-toast{position:fixed;top:25px;right:25px;background:#151d21;border:1px solid #ff5360;border-left:5px solid #ff5360;color:#fff;padding:14px 20px;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.6);display:flex;align-items:center;gap:12px;z-index:9999;animation:slideIn .3s ease-out forwards}.custom-toast strong{display:block;font-size:13px;color:#ff5360}.custom-toast p{margin:2px 0 0;font-size:12px;color:#aeb8ba}@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* MOBILE RESPONSIVE FIXES */
@media (max-width: 992px) {
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .quick-grid { grid-template-columns: repeat(2, 1fr); }
  .lower { grid-template-columns: 1fr; }
}

@media (max-width: 600px) {
  .topbar { padding: 0 15px; }
  .top-actions { gap: 10px; }
  .user-role, .chev { display: none; }
  .content { padding: 15px; }
  .hero { padding: 20px; flex-direction: column-reverse; display: flex; text-align: left; }
  .hero-logo { position: relative; right: 0; top: 0; width: 150px; margin-bottom: 12px; }
  .hero h1 { font-size: 24px; }
  .hero-line { display: none; }
  .kpis { grid-template-columns: 1fr 1fr; gap: 8px; }
  .kpi { padding: 12px; }
  .kpi-value { font-size: 18px; }
  .panel-head { flex-direction: column; align-items: flex-start; gap: 12px; }
  .panel-head-actions { width: 100%; display: flex; gap: 8px; }
  .btn-primary, .btn-secondary { flex: 1; justify-content: center; font-size: 11px; padding: 10px 8px; }
  .quick-grid { grid-template-columns: 1fr; }
  .quick { border-radius: 12px; }
  .custom-toast { left: 15px; right: 15px; top: 15px; }
}
</style>

<script type="module">
import { supabase } from './supabase-config.js';

const app = document.getElementById('app');
const money = function(n) {
  return '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
};

const esc = function(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
};

let currentUser = null;
let currentProfile = {};
let currentAccounts = [];
let currentTx = [];

function showKycToast(message) {
  const existing = document.querySelector('.custom-toast');
  if (existing) existing.remove();

  const toast = document.createElement('div');
  toast.className = 'custom-toast';
  toast.innerHTML = `
    <div style="font-size:22px;color:#ff5360">⚠️</div>
    <div>
      <strong>Verification Required!</strong>
      <p>${message}</p>
    </div>
  `;
  document.body.appendChild(toast);

  setTimeout(() => {
    toast.remove();
    window.location.href = 'verify-identity.html';
  }, 2200);
}

async function loadData() {
  try {
    const { data: { user }, error: authErr } = await supabase.auth.getUser();
    if (authErr || !user) { 
      location.href = 'client-login.html'; 
      return; 
    }
    currentUser = user;

    const profileRes = await supabase.from('profiles').select('*').eq('id', user.id).maybeSingle();
    currentProfile = profileRes.data || {};

    const accountsRes = await supabase.from('trading_accounts').select('*').eq('user_id', user.id);
    currentAccounts = accountsRes.data || [];

    const txRes = await supabase.from('transactions').select('*').eq('user_id', user.id).limit(10);
    currentTx = txRes.data || [];

    updateHeaderAndSidebar();
    renderDashboard();
  } catch (err) {
    console.error('Data Loading Exception:', err);
    app.innerHTML = '<div style="color:#ff6b6b;padding:40px;text-align:center"><h3>Failed to load dashboard data.</h3><p>' + esc(err.message) + '</p></div>';
  }
}

function updateHeaderAndSidebar() {
  const name = (currentProfile.full_name || currentUser.email.split('@')[0] || 'Client').toUpperCase();
  const topNameEl = document.getElementById('topName');
  if (topNameEl) topNameEl.textContent = name;

  const kyc = currentProfile.kyc_status || 'Pending';
  const kycSideEl = document.getElementById('kycSide');
  if (kycSideEl) kycSideEl.textContent = (kyc === 'Verified' || kyc === 'approved') ? 'Verified' : kyc;

  const avatarEl = document.getElementById('topAvatar');
  if (avatarEl) {
    if (currentProfile.avatar_url) {
      avatarEl.innerHTML = '<img src="' + currentProfile.avatar_url + '" style="width:100%;height:100%;object-fit:cover;border-radius:50%" />';
    } else {
      avatarEl.textContent = '●';
    }
  }
}

function renderDashboard() {
  const totalBalance = currentAccounts.reduce((x, v) => x + Number(v.balance || 0), 0);
  const equity = currentAccounts.reduce((x, v) => x + Number(v.equity || v.balance || 0), 0);
  const free = currentAccounts.reduce((x, v) => x + (Number(v.equity || v.balance || 0) - Number(v.used_margin || 0)), 0);
  const pl = currentAccounts.reduce((x, v) => x + Number(v.today_pl || 0), 0);
  const name = (currentProfile.full_name || currentUser.email.split('@')[0] || 'Client').toUpperCase();

  const filteredAccounts = currentAccounts.filter(v => {
    const typeStr = String(v.account_type || v.account_name || '').toLowerCase();
    const isWallet = typeStr.includes('wallet') || String(v.platform || '').toLowerCase().includes('internal');
    return !isWallet;
  });

  let accountsHtml = '';
  if (filteredAccounts.length > 0) {
    accountsHtml = filteredAccounts.map(v => {
      const isDemo = String(v.account_type || '').toLowerCase().includes('demo') || String(v.account_name || '').toLowerCase().includes('demo');
      const type = String(v.account_type || v.account_name || 'Standard');
      const pL = Number(v.today_pl || 0);
      const demoClass = isDemo ? 'demo' : 'live';
      const plClass = pL >= 0 ? 'positive' : 'red-text';
      const plSign = pL >= 0 ? '+' : '';
      
      return '<tr>' +
        '<td><span class="pill ' + demoClass + '">' + (isDemo ? 'Demo' : 'Live') + '</span>' +
        '<div class="account-main" style="margin-top:8px">' + esc(v.account_number || '—') + '</div>' +
        '<div class="account-sub">' + esc(type) + ' / ' + esc(v.leverage || '1:500') + ' / ' + esc(v.currency || 'USD') + '</div></td>' +
        '<td><span class="pill standard">' + esc(type) + '</span></td>' +
        '<td><div class="platform"><span class="mt5">M</span> ' + esc(v.platform || 'MT5') + '</div></td>' +
        '<td>' + money(v.balance) + '</td>' +
        '<td>' + money(v.equity || v.balance) + '</td>' +
        '<td class="' + plClass + '">' + plSign + money(pL) + '</td>' +
        '<td><span class="pill ' + (isDemo ? 'demo' : 'active') + '">' + (isDemo ? 'Demo' : esc(v.status || 'Active')) + '</span></td>' +
        '<td><button class="manage" onclick="location.href=\'new-account.html\'">Manage⌄</button></td>' +
      '</tr>';
    }).join('');
  } else {
    accountsHtml = '<tr><td colspan="8" class="empty-row">No trading account opened yet. Click "Open Live Account" or "Open Demo Account" to create one.</td></tr>';
  }

  let txHtml = '';
  if (currentTx.length > 0) {
    txHtml = '<div class="table-wrap"><table class="tx-table"><tr><th>Date</th><th>Type</th><th>Reference</th><th>Amount</th><th>Status</th></tr>' +
      currentTx.map(v => {
        const st = String(v.status || '').toLowerCase();
        const cls = (st === 'approved' || st === 'completed') ? 'green' : ((st === 'cancelled' || st === 'rejected') ? 'red' : 'pending');
        const amt = Number(v.amount || 0);
        const amtSign = amt >= 0 ? '+' : '';
        const amtClass = amt >= 0 ? 'green-text' : 'red-text';
        const dStr = v.transaction_date ? new Date(v.transaction_date).toLocaleDateString() : '—';
        return '<tr>' +
          '<td>' + dStr + '</td>' +
          '<td>' + esc(v.type || '—') + '</td>' +
          '<td>' + esc(v.reference || '—') + '</td>' +
          '<td class="' + amtClass + '">' + amtSign + money(amt) + '</td>' +
          '<td><span class="statusbadge ' + cls + '">' + esc(v.status || 'Pending') + '</span></td>' +
        '</tr>';
      }).join('') +
      '</table></div>';
  } else {
    txHtml = '<div class="empty">No transactions yet.</div>';
  }

  const plPct = totalBalance ? ((pl / Math.max(totalBalance, 1)) * 100).toFixed(2) : '0.00';

  app.innerHTML = 
    '<section class="hero"><img class="hero-logo" src="buraq-logo.jpg" alt="Buraq Markets"><div class="hero-line"></div><div class="hero-copy"><small>Welcome back,</small><h1>' + esc(name) + '</h1><p>Here\'s what\'s happening with your accounts today.</p></div></section>' +
    '<section class="kpis">' +
      '<div class="kpi"><div class="kpi-head"><span>Total Balance</span><b>›</b></div><div class="kpi-value">' + money(totalBalance) + '</div><div class="kpi-sub">All trading accounts combined</div></div>' +
      '<div class="kpi"><div class="kpi-head"><span>Total Equity</span><b>›</b></div><div class="kpi-value">' + money(equity) + '</div><div class="kpi-sub">Current account equity</div></div>' +
      '<div class="kpi"><div class="kpi-head"><span>Total Free Margin</span><b>›</b></div><div class="kpi-value">' + money(free) + '</div><div class="kpi-sub">Equity minus used margin</div></div>' +
      '<div class="kpi"><div class="kpi-head"><span>Total P/L</span><b>›</b></div><div class="kpi-value ' + (pl >= 0 ? 'green-text' : 'red-text') + '">' + (pl >= 0 ? '+' : '') + money(pl) + '</div><div class="kpi-sub green">' + plPct + '% from balance</div></div>' +
    '</section>' +
    '<section class="panel accounts-panel" id="accounts">' +
      '<div class="panel-head">' +
        '<div class="panel-title">Trading Accounts</div>' +
        '<div class="panel-head-actions">' +
          '<button class="btn-secondary" id="btnOpenDemo">＋ Open Demo Account</button>' +
          '<button class="btn-primary" id="btnOpenLive">＋ Open Live Account</button>' +
        '</div>' +
      '</div>' +
      '<div class="table-wrap">' +
        '<table class="account-table">' +
          '<thead><tr><th>Account</th><th>Type</th><th>Platform</th><th>Balance</th><th>Equity</th><th>P/L</th><th>Status</th><th>Action</th></tr></thead>' +
          '<tbody>' + accountsHtml + '</tbody>' +
        '</table>' +
      '</div>' +
    '</section>' +
    '<section class="panel quick-panel" id="funds"><div class="panel-title">Quick Actions</div><div class="quick-grid"><a class="quick" href="deposit.html"><span class="quick-icon q-green">↓</span><div><b>Deposit Funds</b><span>Add money to wallet</span></div></a><a class="quick" href="withdraw.html"><span class="quick-icon q-red">↑</span><div><b>Withdraw Funds</b><span>Withdraw to bank account</span></div></a><a class="quick" href="transfer.html"><span class="quick-icon q-blue">⇄</span><div><b>Transfer Funds</b><span>Internal transfer</span></div></a><a class="quick" href="#" onclick="return false"><span class="quick-icon q-purple">⤓</span><div><b>Download MT5</b><span>Windows / Android / iOS</span></div></a><a class="quick" href="contact.html"><span class="quick-icon q-gold">◉</span><div><b>Contact Support</b><span>We\'re here to help</span></div></a></div></section>' +
    '<section class="lower">' +
      '<div class="panel"><div class="panel-title" style="margin-bottom:12px">Recent Transactions</div>' + txHtml + '</div>' +
      '<div class="panel"><div class="panel-title" style="margin-bottom:12px">Account Summary</div>' +
        '<div class="row"><span>Account Holder</span><b>' + esc((currentProfile.full_name || '—').toUpperCase()) + '</b></div>' +
        '<div class="row"><span>Client ID</span><b>' + esc(currentProfile.client_id || '—') + '</b></div>' +
        '<div class="row"><span>Email</span><b>' + esc(currentUser.email) + '</b></div>' +
        '<div class="row"><span>KYC Status</span><b class="' + ((currentProfile.kyc_status || 'Pending') === 'Verified' ? 'green-text' : 'gold-text') + '">' + esc(currentProfile.kyc_status || 'Pending') + '</b></div>' +
      '</div>' +
    '</section>';

  document.getElementById('btnOpenDemo')?.addEventListener('click', () => { location.href = 'new-demo-account.html'; });

  document.getElementById('btnOpenLive')?.addEventListener('click', () => {
    const kyc = String(currentProfile.kyc_status || '').toLowerCase();
    if (kyc === 'verified' || kyc === 'approved') {
      location.href = 'new-account.html';
    } else {
      showKycToast('Please complete KYC Verification first to open a Live Account.');
    }
  });
}

// Sidebar Mobile Toggle Handling
const menuToggle = document.getElementById('menuToggle');
const sidebar = id => document.getElementById(id);
menuToggle?.addEventListener('click', () => {
  sidebar('sidebar')?.classList.toggle('open');
  sidebar('sidebarOverlay')?.classList.toggle('show');
});
sidebar('sidebarOverlay')?.addEventListener('click', () => {
  sidebar('sidebar')?.classList.remove('open');
  sidebar('sidebarOverlay')?.classList.remove('show');
});

const trigger = document.getElementById('userDropdownTrigger');
const menu = document.getElementById('profileMenu');
trigger?.addEventListener('click', (e) => { e.stopPropagation(); menu?.classList.toggle('show'); });
document.addEventListener('click', () => menu?.classList.remove('show'));

const handleLogout = async (e) => {
  e.preventDefault();
  await supabase.auth.signOut();
  location.href = 'client-login.html';
};
document.getElementById('sideLogout')?.addEventListener('click', handleLogout);
document.getElementById('topLogout')?.addEventListener('click', handleLogout);

loadData();
</script>

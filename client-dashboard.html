<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Client Portal — Buraq Markets</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080a0c;color:#e1e7ec;font-family:Inter,Arial,sans-serif;padding:24px}

.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.brand{font:bold 22px Georgia,serif;color:#f4cf72}
.user-info{display:flex;align-items:center;gap:15px}
.user-email{background:#11161d;padding:8px 14px;border-radius:6px;border:1px solid #1f2933;font-size:12px;color:#f4cf72}
.btn{padding:9px 16px;border-radius:6px;border:none;font-weight:bold;font-size:13px;cursor:pointer}
.logout-btn{background:#e63946;color:#fff}.logout-btn:hover{background:#c72c38}
.deposit-btn{background:#f4cf72;color:#080a0c}.deposit-btn:hover{background:#e0ba5c}

/* Summary Grid */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:30px}
.stat-card{background:#0d1117;border:1px solid #1f2937;border-radius:12px;padding:20px;display:flex;flex-direction:column;justify-content:space-between}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.stat-card .title{font-size:13px;color:#9ca3af;font-weight:500}
.stat-card .chevron{color:#6b7280;font-size:14px}
.stat-card .value{font-size:26px;font-weight:700;color:#ffffff;margin-bottom:6px}
.stat-card .subtext{font-size:12px;color:#6b7280}
.text-green{color:#10b981 !important}

/* Wallet Badge on Top of Card */
.wallet-badge{background:rgba(244,207,114,0.15);color:#f4cf72;border:1px solid rgba(244,207,114,0.3);padding:3px 8px;border-radius:4px;font-size:11px;font-weight:600}

/* Modal Popup */
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);justify-content:center;align-items:center;z-index:999}
.modal-box{background:#11161d;border:1px solid #1f2933;border-radius:12px;padding:25px;width:100%;max-width:420px;color:#fff}
.modal-box h3{margin-top:0;color:#f4cf72}
.form-group{margin-bottom:15px}
.form-group label{display:block;font-size:12px;color:#8899a6;margin-bottom:6px}
.form-group input{width:100%;padding:10px;border-radius:6px;border:1px solid #1f2933;background:#080a0c;color:#fff;font-size:13px}
.form-group input[readonly]{background:#161d26;color:#f4cf72;cursor:not-allowed}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.cancel-btn{background:#374151;color:#fff}
</style>
</head>
<body>

<div class="header">
  <div class="brand">BURAQ MARKETS</div>
  <div class="user-info">
    <div class="user-email" id="clientEmail">Loading...</div>
    <button class="btn deposit-btn" id="openDepositModalBtn">+ Deposit</button>
    <button class="btn logout-btn" id="logoutBtn">Logout</button>
  </div>
</div>

<!-- 4 Panel Cards Layout -->
<div class="stats-grid">

  <!-- Total Balance Card (Wallet No. is inside top header) -->
  <div class="stat-card">
    <div class="card-header">
      <span class="title">Total Balance</span>
      <span class="wallet-badge" id="walletAccountVal">Wallet: Loading...</span>
    </div>
    <div class="value" id="totalBalanceVal">$0.00</div>
    <div class="subtext">All trading accounts combined</div>
  </div>

  <!-- Total Equity Card -->
  <div class="stat-card">
    <div class="card-header">
      <span class="title">Total Equity</span>
      <span class="chevron">›</span>
    </div>
    <div class="value" id="totalEquityVal">$0.00</div>
    <div class="subtext">Current account equity</div>
  </div>

  <!-- Total Free Margin Card -->
  <div class="stat-card">
    <div class="card-header">
      <span class="title">Total Free Margin</span>
      <span class="chevron">›</span>
    </div>
    <div class="value" id="freeMarginVal">$0.00</div>
    <div class="subtext">Equity minus used margin</div>
  </div>

  <!-- Total P/L Card -->
  <div class="stat-card">
    <div class="card-header">
      <span class="title">Total P/L</span>
      <span class="chevron">›</span>
    </div>
    <div class="value text-green" id="plVal">+$0.00</div>
    <div class="subtext text-green">0.00% from balance</div>
  </div>

</div>

<!-- Deposit Modal -->
<div class="modal-overlay" id="depositModal">
  <div class="modal-box">
    <h3>Deposit Funds</h3>
    <form id="depositForm">
      <div class="form-group">
        <label>Selected Wallet Account Number (Client ID)</label>
        <input type="text" id="depositWalletInput" readonly>
      </div>
      <div class="form-group">
        <label>Amount ($)</label>
        <input type="number" id="depositAmount" placeholder="Enter amount e.g. 500" required step="0.01">
      </div>
      <div class="form-group">
        <label>Transaction Reference / TxID</label>
        <input type="text" id="depositRef" placeholder="Transaction Hash or Bank Ref" required>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn cancel-btn" id="closeDepositModalBtn">Cancel</button>
        <button type="submit" class="btn deposit-btn">Submit Deposit</button>
      </div>
    </form>
  </div>
</div>

<script type="module">
import { supabase } from './supabase-config.js';

let currentUser = null;
let currentWalletNo = '-';

const clientEmailEl = document.getElementById('clientEmail');
const walletAccountVal = document.getElementById('walletAccountVal');
const totalBalanceVal = document.getElementById('totalBalanceVal');
const totalEquityVal = document.getElementById('totalEquityVal');
const freeMarginVal = document.getElementById('freeMarginVal');
const plVal = document.getElementById('plVal');

const depositModal = document.getElementById('depositModal');
const openDepositModalBtn = document.getElementById('openDepositModalBtn');
const closeDepositModalBtn = document.getElementById('closeDepositModalBtn');
const depositForm = document.getElementById('depositForm');
const depositWalletInput = document.getElementById('depositWalletInput');

async function initClientDashboard() {
  const { data: { user } } = await supabase.auth.getUser();
  if (!user) {
    location.href = 'client-login.html';
    return;
  }
  
  currentUser = user;
  clientEmailEl.textContent = user.email;

  await loadClientProfile();
}

async function loadClientProfile() {
  const { data: profile } = await supabase
    .from('profiles')
    .select('*')
    .eq('id', currentUser.id)
    .maybeSingle();

  const { data: clientData } = await supabase
    .from('clients')
    .select('*')
    .or(`id.eq.${currentUser.id},user_id.eq.${currentUser.id}`)
    .maybeSingle();

  const merged = { ...profile, ...clientData };

  // Fetch client_id as primary wallet number
  currentWalletNo = merged.client_id || merged.account_number || merged.wallet_address || merged.id;

  // Display top badge on Total Balance Card & set modal input
  walletAccountVal.textContent = '#' + currentWalletNo;
  depositWalletInput.value = currentWalletNo;

  const bal = parseFloat(merged.balance || 0);
  const eq = parseFloat(merged.equity || bal);
  const freeMargin = parseFloat(merged.free_margin || eq);
  const pl = parseFloat(merged.profit_loss || 0);

  totalBalanceVal.textContent = '$' + bal.toFixed(2);
  totalEquityVal.textContent = '$' + eq.toFixed(2);
  freeMarginVal.textContent = '$' + freeMargin.toFixed(2);
  plVal.textContent = (pl >= 0 ? '+' : '') + '$' + pl.toFixed(2);
}

depositForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const amount = document.getElementById('depositAmount').value;
  const ref = document.getElementById('depositRef').value;

  const { error } = await supabase.from('transactions').insert([
    {
      user_id: currentUser.id,
      email: currentUser.email,
      wallet_address: currentWalletNo,
      amount: parseFloat(amount),
      type: 'Deposit',
      reference: ref,
      status: 'Pending'
    }
  ]);

  if (error) {
    alert('Deposit Failed: ' + error.message);
  } else {
    alert('Deposit request submitted successfully for Wallet: ' + currentWalletNo);
    depositModal.style.display = 'none';
    depositForm.reset();
    depositWalletInput.value = currentWalletNo;
  }
});

openDepositModalBtn.addEventListener('click', () => depositModal.style.display = 'flex');
closeDepositModalBtn.addEventListener('click', () => depositModal.style.display = 'none');
document.getElementById('logoutBtn').addEventListener('click', async () => {
  await supabase.auth.signOut();
  location.href = 'client-login.html';
});

initClientDashboard();
</script>
</body>
</html>

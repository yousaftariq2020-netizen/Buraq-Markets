<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Banner</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0e11;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Outer Container Box with Golden Border & Glow */
    .dashboard-banner {
      position: relative;
      width: 100%;
      max-width: 1000px;
      height: 200px;
      border-radius: 20px;
      border: 2px solid #b8933b;
      box-shadow: 0 0 30px rgba(184, 147, 59, 0.35);
      background: #11151b;
      display: flex;
      overflow: hidden;
    }

    /* Background Chart Pattern Overlay */
    .chart-overlay {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 0);
      background-size: 24px 24px;
      opacity: 0.6;
      pointer-events: none;
      z-index: 1;
    }

    /* Left Section: Dark Background */
    .banner-left {
      position: relative;
      z-index: 3;
      width: 280px;
      padding: 35px 30px;
      background: #181d24;
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-shadow: 5px 0 25px rgba(0, 0, 0, 0.5);
    }

    .sub-heading {
      color: #9eaab0;
      font-size: 15px;
      font-weight: 400;
      margin-bottom: 4px;
    }

    .user-name {
      color: #ffffff;
      font-size: 38px;
      font-weight: 800;
      margin: 0 0 8px 0;
      letter-spacing: 1px;
      line-height: 1;
    }

    .description {
      color: #7b878c;
      font-size: 13px;
      margin: 0;
      line-height: 1.4;
    }

    /* Right Section: Metallic Gold Gradient */
    .banner-right {
      position: relative;
      z-index: 2;
      flex: 1;
      background: linear-gradient(
        115deg,
        #13181f 0%,
        #2c2210 25%,
        #69511c 50%,
        #ab8731 75%,
        #cfa63c 100%
      );
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 50px;
      overflow: hidden;
    }

    /* Diagonal Glowing Beams */
    .beam {
      position: absolute;
      top: -60%;
      bottom: -60%;
      background: linear-gradient(
        to bottom,
        rgba(255, 243, 176, 0) 0%,
        rgba(255, 235, 140, 0.6) 50%,
        rgba(255, 243, 176, 0) 100%
      );
      transform: rotate(-32deg);
      filter: blur(4px);
      pointer-events: none;
    }

    .beam-1 { right: 320px; width: 25px; opacity: 0.4; }
    .beam-2 { right: 210px; width: 45px; opacity: 0.7; }
    .beam-3 { right: 60px;  width: 35px; opacity: 0.9; }

    /* Buraq Logo & Typography */
    .brand-wrapper {
      position: relative;
      z-index: 4;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .buraq-logo {
      height: 75px;
      width: auto;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.4));
    }

    .brand-text {
      display: flex;
      flex-direction: column;
    }

    .brand-title {
      color: #fce8a6;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 2px;
      line-height: 0.9;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
    }

    .brand-sub {
      color: #ffffff;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 4px;
      margin-top: 2px;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
    }

    .brand-tagline {
      color: #11151b;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <div class="dashboard-banner">
    <!-- Chart Background Graphic Overlay -->
    <div class="chart-overlay"></div>

    <!-- Left Content Box -->
    <div class="banner-left">
      <span class="sub-heading">Welcome back,</span>
      <h1 class="user-name">AQEEL</h1>
      <p class="description">Here’s what’s happening with<br>your accounts today.</p>
    </div>

    <!-- Right Metallic Gold & Light Streaks Area -->
    <div class="banner-right">
      <!-- Glowing Light Beams -->
      <div class="beam beam-1"></div>
      <div class="beam beam-2"></div>
      <div class="beam beam-3"></div>

      <!-- Buraq Branding -->
      <div class="brand-wrapper">
        <img src="buraq-logo.png" alt="Buraq Markets" class="buraq-logo" />
        <div class="brand-text">
          <span class="brand-title">BURAQ</span>
          <span class="brand-sub">MARKETS</span>
          <span class="brand-tagline">TRADE BEYOND LIMITS</span>
        </div>
      </div>
    </div>
  </div>

</body>
</html>

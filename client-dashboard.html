<style>

*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 75% 0%,#10221a 0,transparent 28%),var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;font-size:14px}a{text-decoration:none;color:inherit}button{font:inherit}
.layout{min-height:100vh;display:flex}.sidebar{width:248px;position:fixed;inset:0 auto 0 0;background:linear-gradient(180deg,#0b1216,#070b0d);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:40;transform:translateX(-105%);transition:transform .24s ease;box-shadow:18px 0 45px rgba(0,0,0,.28);overflow:hidden;height:100%;max-height:100vh}.sidebar.open{transform:translateX(0)}.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.58);backdrop-filter:blur(2px);z-index:35;opacity:0;visibility:hidden;transition:opacity .2s ease,visibility .2s ease}.sidebar-overlay.show{opacity:1;visibility:visible}.main{margin-left:0;min-width:0;flex:1}.logo-wrap{height:96px;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:14px 22px;border-bottom:1px solid var(--border)}.logo{width:175px;height:auto;display:block;object-fit:contain}.side-nav{padding:18px 13px;display:flex;flex-direction:column;gap:5px;flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:#2a3a40 transparent}.side-nav::-webkit-scrollbar{width:5px}.side-nav::-webkit-scrollbar-thumb{background:#2a3a40;border-radius:10px}.side-link{display:flex;align-items:center;gap:13px;padding:12px 13px;border-radius:9px;color:#b8c1c3;font-size:14px;font-weight:600;transition:.18s;flex-shrink:0}.side-link:hover{background:#101b1f;color:#fff}.side-link.active{background:linear-gradient(90deg,#0d5d3d,#10442f);color:#fff;box-shadow:inset 0 0 0 1px #176d49}.ico{width:22px;text-align:center;font-size:18px}.kyc-dot{margin-left:auto;background:#18a968;color:#fff;border-radius:10px;padding:3px 7px;font-size:9px}.side-bottom{margin-top:auto;padding:14px;flex-shrink:0}.help{border:1px solid #263238;background:#0c1418;border-radius:10px;padding:14px;display:flex;gap:11px;align-items:center;color:#aeb8ba}.help strong{display:block;color:#fff;font-size:13px}.help small{display:block;margin-top:4px;color:#778387}.topbar{height:72px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 28px;background:rgba(7,11,13,.82);backdrop-filter:blur(12px);position:sticky;top:0;z-index:10}.hamb{font-size:24px;color:#d9e0df;margin-right:22px;border:0;background:transparent;padding:4px;cursor:pointer;line-height:1}.top-title{font-size:20px;font-weight:700}.top-actions{margin-left:auto;display:flex;align-items:center;gap:22px}.circle-btn{width:40px;height:40px;border:1px solid var(--border);border-radius:50%;background:#0d1418;color:#dce4e3;display:grid;place-items:center;cursor:pointer}.bell{position:relative}.bell:after{content:'2';position:absolute;right:-2px;top:-3px;background:#23b86d;color:#fff;border-radius:50%;font-size:9px;min-width:16px;height:16px;display:grid;place-items:center}.user{display:flex;align-items:center;gap:10px}.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#475258,#12181c);display:grid;place-items:center;color:#dfe7e5;font-size:18px}.user-name{font-weight:700}.user-role{font-size:11px;color:var(--muted);margin-top:3px}.chev{color:#829093;margin-left:8px}.content{padding:27px 28px 36px;max-width:1450px;margin:auto}.hero{position:relative;overflow:hidden;min-height:160px;border:1px solid #184b37;border-radius:12px;background:linear-gradient(110deg,#062319,#071511 56%,#062219);padding:30px 34px;margin-bottom:18px}.hero:before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 45%,rgba(21,150,96,.13) 45%,transparent 46%,transparent 62%,rgba(21,150,96,.08) 62%,transparent 63%),radial-gradient(circle at 82% 65%,rgba(31,192,120,.18),transparent 32%)}.hero-line{position:absolute;right:-4%;bottom:12px;width:58%;height:100px;opacity:.75;background:linear-gradient(135deg,transparent 0 15%,rgba(32,198,124,.2) 16% 17%,transparent 18% 29%,rgba(32,198,124,.35) 30% 31%,transparent 32% 43%,rgba(32,198,124,.6) 44% 45%,transparent 46% 58%,rgba(32,198,124,.72) 59% 60%,transparent 61% 72%,rgba(32,198,124,.8) 73% 74%,transparent 75%);transform:skewY(-13deg)}.hero-copy{position:relative;z-index:2}.hero small{color:#c8d2cf;font-size:16px}.hero h1{margin:7px 0 4px;font-size:34px;letter-spacing:-.5px}.hero p{margin:0;color:#9eaaa8;font-size:13px}.hero-logo{position:absolute;z-index:2;right:38px;top:25px;width:210px;max-height:110px;object-fit:contain;filter:drop-shadow(0 8px 18px rgba(0,0,0,.4))}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}.kpi{background:linear-gradient(145deg,#11191d,#0d1417);border:1px solid var(--border);border-radius:11px;padding:20px 20px 17px;min-width:0}.kpi-head{display:flex;align-items:center;justify-content:space-between;color:#aab5b7;font-size:12px}.kpi-icon{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:18px;margin-bottom:10px;flex-shrink:0}.kpi-icon svg{width:55%;height:55%;display:block}.i-green{background:#08291d;color:#1fd27d}.i-purple{background:#201333;color:#a675ff}.i-blue{background:#08243c;color:#55a9ff}.i-darkgreen{background:#10231b;color:#2ed184}.kpi-value{font-size:25px;font-weight:800;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kpi-sub{font-size:11px;color:#768285;margin-top:6px}.kpi-sub.green{color:#2cd17f}
.panel{background:linear-gradient(145deg,#10171b,#0d1316);border:1px solid var(--border);border-radius:12px}.accounts-panel{overflow:hidden}.panel-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px}.panel-title{font-size:18px;font-weight:700}.btn-primary{background:#11a861;color:#fff;border:1px solid #18c879;border-radius:7px;padding:10px 15px;font-weight:700;font-size:12px;cursor:pointer}.btn-primary:hover{background:#16b96d}.table-wrap{overflow:auto}.account-table{width:100%;border-collapse:collapse;min-width:880px}.account-table th{padding:12px 20px;text-align:left;color:#7e8a8e;font-size:11px;font-weight:500;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}.account-table td{padding:15px 20px;border-bottom:1px solid #1c2529;color:#d7dddd;font-size:12px;vertical-align:middle}.account-table tr:last-child td{border-bottom:0}.account-main{font-size:15px;font-weight:800;color:#eef4f2}.account-sub{color:#899598;font-size:11px;margin-top:4px}.pill{display:inline-flex;align-items:center;border-radius:5px;padding:6px 9px;font-size:10px;font-weight:700}.live{background:#0d3a27;color:#39dc8b}.demo{background:#082e54;color:#4eafff}.standard{background:#0b355b;color:#5bb5ff}.ecn{background:#2d1849;color:#bd8aff}.active{background:#0d3a27;color:#4de292}.platform{display:flex;align-items:center;gap:7px;font-weight:700}.mt5{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#17c878,#0c7650);display:grid;place-items:center;font-size:11px}.positive{color:#2ddd84;font-weight:700}.manage{background:transparent;border:1px solid #334047;color:#dce4e3;border-radius:7px;padding:8px 12px;font-size:11px;cursor:pointer}.manage:hover{border-color:#4a666e}.empty-row{text-align:center;color:#778487;padding:35px!important}
.quick-panel{margin-top:18px;padding:20px}.quick-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px}.quick{border:1px solid #273238;background:#0c1418;border-radius:9px;padding:16px;display:flex;align-items:center;gap:12px;cursor:pointer}.quick:hover{border-color:#31504a;background:#0e191c}.quick-icon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:18px;flex:0 0 40px}.quick-icon svg{width:52%;height:52%;display:block}.q-green{background:#0b2b1e;color:#19cf79}.q-red{background:#351318;color:#ff6370}.q-blue{background:#092c47;color:#4aa9ff}.q-purple{background:#29173c;color:#aa74ff}.q-gold{background:#32270d;color:#e8b940}.quick b{display:block;font-size:12px}.quick span{display:block;color:#7f8c90;font-size:10px;margin-top:4px}
.lower{display:grid;grid-template-columns:1.4fr .8fr;gap:15px;margin-top:18px}.lower .panel{padding:20px}.tx-table{width:100%;border-collapse:collapse;font-size:11px}.tx-table th,.tx-table td{padding:11px 7px;border-bottom:1px solid #20292d;text-align:left}.tx-table th{color:#7f8b8f;font-weight:500}.tx-table td{color:#cbd4d3}.statusbadge{display:inline-block;padding:4px 8px;border-radius:20px;font-size:9px;font-weight:700;text-transform:uppercase}.statusbadge.pending{background:#33290d;color:#efc24b;border:1px solid #594811}.statusbadge.green{background:#0d3020;color:#4be090;border:1px solid #1b5a39}.statusbadge.red{background:#351316;color:#ff6d77;border:1px solid #5a1d22}.row{display:flex;justify-content:space-between;gap:15px;padding:11px 0;border-bottom:1px solid #20292d;font-size:11px}.row span{color:#7f8b8f}.row b{color:#dbe3e2;text-align:right}.green-text{color:#2ddd84!important}.red-text{color:#ff6670!important}.gold-text{color:#e3b64e!important}.errorbox{padding:18px;border:1px solid #5b2929;background:#1b0c0c;border-radius:10px;color:#ffb0b0;margin-bottom:15px}.empty{color:#778487;font-size:12px;padding:20px 0}.loading{padding:80px;text-align:center;color:#9ba6a8}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.quick-grid{grid-template-columns:repeat(2,1fr)}.lower{grid-template-columns:1fr}.hero-logo{width:170px;right:25px}.hero{padding-right:220px}}
@media(max-width:760px){.sidebar{width:min(320px,88vw)}.layout{display:block}.logo-wrap{height:76px}.side-nav{display:grid;grid-template-columns:repeat(2,1fr);padding:10px;overflow-y:auto;-webkit-overflow-scrolling:touch}.side-bottom{display:none}.side-link{font-size:12px;padding:10px}.topbar{height:62px;padding:0 15px}.top-actions{gap:8px}.user-name,.user-role,.chev{display:none}.content{padding:15px}.hero{padding:23px;min-height:150px}.hero-logo{opacity:.22;width:190px;right:15px;top:25px}.hero h1{font-size:28px}.kpis{grid-template-columns:1fr 1fr;gap:8px}.kpi{padding:15px}.kpi-value{font-size:19px}.kpi-icon{width:34px;height:34px}.quick-grid{grid-template-columns:1fr}.quick-icon{width:36px;height:36px;flex:0 0 36px}.lower{grid-template-columns:1fr}.top-title{font-size:17px}.hamb{margin-right:12px}}
@media(max-width:480px){.kpis{grid-template-columns:1fr}.side-nav{grid-template-columns:1fr 1fr}.hero h1{font-size:24px}.hero small{font-size:13px}.hero p{font-size:11px}.panel-head{padding:15px}.btn-primary{padding:9px 11px}.content{padding:10px}.kpi-icon{width:32px;height:32px}.quick-icon{width:34px;height:34px;flex:0 0 34px}}
</style>

</aside>
<section class="main">
<header class="topbar"><button class="hamb" id="menuToggle" aria-label="Open navigation" aria-expanded="false">☰</button><div class="top-title">Dashboard</div><div class="top-actions"><button class="circle-btn" aria-label="Theme">☾</button><button class="circle-btn bell" aria-label="Notifications">♧</button><div class="user"><div class="avatar">●</div><div><div class="user-name" id="topName">Client</div><div class="user-role">Client</div></div><span class="chev">⌄</span></div></div></header>
<main id="dashboard" class="content"><div id="app"><div class="loading">Loading your secure client area…</div></div></main>
</section>
</div>
<script type="module">
import { supabase } from './supabase-config.js';
const app=document.getElementById('app');
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n||0));
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const freeMarginOf=v=>Number(v.equity||0)-Number(v.used_margin||0);
async function load(){
 const {data:{user}}=await supabase.auth.getUser();
 if(!user){location.href='client-login.html';return;}
 const [profileRes,accountsRes,txRes]=await Promise.all([
  supabase.from('profiles').select('*').eq('id',user.id).maybeSingle(),
  supabase.from('trading_accounts').select('*').eq('user_id',user.id).order('created_at',{ascending:true}),
  supabase.from('transactions').select('*').eq('user_id',user.id).order('transaction_date',{ascending:false}).limit(10)
 ]);
 if(profileRes.error||accountsRes.error||txRes.error){app.innerHTML='<div class="errorbox"><b>Dashboard setup incomplete.</b><br>Please make sure you ran <code>supabase-schema.sql</code> in the Supabase SQL Editor, then refresh this page.</div>';return;}
 const p=profileRes.data||{}, accounts=accountsRes.data||[], tx=txRes.data||[];
 const totalBalance=accounts.reduce((x,v)=>x+Number(v.balance||0),0), equity=accounts.reduce((x,v)=>x+Number(v.equity||0),0), free=accounts.reduce((x,v)=>x+freeMarginOf(v),0), pl=accounts.reduce((x,v)=>x+Number(v.today_pl||0),0);
 const name=(p.full_name||user.email?.split('@')[0]||'Client').toUpperCase();
 document.getElementById('topName').textContent=name;
 const kyc=p.kyc_status||'Pending';document.getElementById('kycSide').textContent=kyc==='Verified'?'Verified':kyc;
 app.innerHTML=`
 <section class="hero"><img class="hero-logo" src="buraq-logo.jpg" alt="Buraq Markets"><div class="hero-line"></div><div class="hero-copy"><small>Welcome back,</small><h1>${esc(name)}</h1><p>Here's what's happening with your accounts today.</p></div></section>
 <section class="kpis">
  <div class="kpi"><div class="kpi-icon i-green"><svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M2 10h20"/><circle cx="12" cy="14" r="1.5"/></svg></div><div class="kpi-head"><span>Total Balance</span><b>›</b></div><div class="kpi-value">${money(totalBalance)}</div><div class="kpi-sub">All trading accounts combined</div></div>
  <div class="kpi"><div class="kpi-icon i-purple"><svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 14l4-4 4 4 5-6"/></svg></div><div class="kpi-head"><span>Total Equity</span><b>›</b></div><div class="kpi-value">${money(equity)}</div><div class="kpi-sub">Current account equity</div></div>
  <div class="kpi"><div class="kpi-icon i-blue"><svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div><div class="kpi-head"><span>Total Free Margin</span><b>›</b></div><div class="kpi-value">${money(free)}</div><div class="kpi-sub">Equity minus used margin</div></div>
  <div class="kpi"><div class="kpi-icon i-darkgreen"><svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l6-6 4 4 7-7"/><path d="M14 8h6v6"/></svg></div><div class="kpi-head"><span>Total P/L</span><b>›</b></div><div class="kpi-value ${pl>=0?'green-text':'red-text'}">${pl>=0?'+':''}${money(pl)}</div><div class="kpi-sub ${pl>=0?'green':''}">${totalBalance?((pl/Math.max(totalBalance,1))*100).toFixed(2):'0.00'}% from balance</div></div>
 </section>
 <section class="panel accounts-panel" id="accounts"><div class="panel-head"><div class="panel-title">Trading Accounts</div><a class="btn-primary" href="new-account.html">＋ Open New Account</a></div><div class="table-wrap"><table class="account-table"><thead><tr><th>Account</th><th>Type</th><th>Platform</th><th>Balance</th><th>Equity</th><th>P/L</th><th>Status</th><th>Action</th></tr></thead><tbody>
 ${accounts.length?accounts.map(v=>{const isDemo=String(v.account_type||'').toLowerCase().includes('demo')||String(v.account_name||'').toLowerCase().includes('demo');const type=String(v.account_type||v.account_name||'Standard');const pL=Number(v.today_pl||0);return `<tr><td><span class="pill ${isDemo?'demo':'live'}">${isDemo?'Demo':'Live'}</span><div class="account-main" style="margin-top:8px">${esc(v.account_number||'—')}</div><div class="account-sub">${esc(type)} / ${esc(v.leverage||'1:500')} / ${esc(v.currency||'USD')}</div></td><td><span class="pill ${type.toLowerCase().includes('ecn')?'ecn':'standard'}">${esc(type)}</span></td><td><div class="platform"><span class="mt5">M</span> ${esc(v.platform||'MT5')}</div></td><td>${money(v.balance)}</td><td>${money(v.equity)}</td><td class="${pL>=0?'positive':'red-text'}">${pL>=0?'+':''}${money(pL)}</td><td><span class="pill ${isDemo?'demo':'active'}">${isDemo?'Demo':esc(v.status||'Active')}</span></td><td><button class="manage" onclick="location.href='new-account.html'">Manage⌄</button></td></tr>`}).join(''):'<tr><td colspan="8" class="empty-row">No trading account has been created yet.</td></tr>'}
 </tbody></table></div></section>
 <section class="panel quick-panel" id="funds"><div class="panel-title">Quick Actions</div><div class="quick-grid"><a class="quick" href="deposit.html"><span class="quick-icon q-green"><svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 19h14"/></svg></span><div><b>Deposit Funds</b><span>Add money to wallet</span></div></a><a class="quick" href="withdraw.html"><span class="quick-icon q-red"><svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 21V9"/><path d="M7 14l5-5 5 5"/><path d="M5 5h14"/></svg></span><div><b>Withdraw Funds</b><span>Withdraw to bank account</span></div></a><a class="quick" href="transfer.html"><span class="quick-icon q-blue"><svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M7 16l-4-4 4-4"/><path d="M3 12h11"/><path d="M17 8l4 4-4 4"/><path d="M21 12H10"/></svg></span><div><b>Transfer Funds</b><span>Internal transfer</span></div></a><a class="quick" href="#" onclick="alert('Connect your MT5/WebTrader integration here.');return false"><span class="quick-icon q-purple"><svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><rect x="4" y="17" width="16" height="4" rx="1"/></svg></span><div><b>Download MT5</b><span>Windows / Android / iOS</span></div></a><a class="quick" href="contact.html"><span class="quick-icon q-gold"><svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/></svg></span><div><b>Contact Support</b><span>We're here to help</span></div></a></div></section>
 <section class="lower"><div class="panel" id="transactions"><div class="panel-title" style="margin-bottom:12px">Recent Transactions</div>${tx.length?`<div class="table-wrap"><table class="tx-table"><tr><th>Date</th><th>Type</th><th>Reference</th><th>Amount</th><th>Status</th></tr>${tx.map(v=>{const st=String(v.status||'').toLowerCase();const cls=st==='approved'||st==='completed'?'green':(st==='cancelled'||st==='rejected'?'red':'pending');return `<tr><td>${new Date(v.transaction_date).toLocaleDateString()}</td><td>${esc(v.type)}</td><td>${esc(v.reference)}</td><td class="${Number(v.amount)>=0?'green-text':'red-text'}">${Number(v.amount)>=0?'+':''}${money(v.amount)}</td><td><span class="statusbadge ${cls}">${esc(v.status)}</span></td></tr>`}).join('')}</table></div>`:'<div class="empty">No transactions yet.</div>'}</div>
 <div class="panel" id="profile"><div class="panel-title" style="margin-bottom:12px">Profile & KYC</div><div class="row"><span>Account Holder</span><b>${esc((p.full_name||'—').toUpperCase())}</b></div><div class="row"><span>Client ID</span><b>${esc(p.client_id||'—')}</b></div><div class="row"><span>Email</span><b>${esc(user.email)}</b></div><div class="row"><span>KYC Status</span><b class="${kyc==='Verified'?'green-text':kyc==='Rejected'?'red-text':'gold-text'}">${esc(kyc)}</b></div>${kyc!=='Verified'?`<div class="row"><span>Action</span><a href="verify-identity.html" class="gold-text">Verify Identity →</a></div>`:''}<div class="row"><span>Support</span><a href="contact.html" class="gold-text">Contact Support →</a></div></div></section>`;
}
const sidebar=document.querySelector('.sidebar');
const overlay=document.getElementById('sidebarOverlay');
const menuToggle=document.getElementById('menuToggle');
function setMenu(open){
 sidebar.classList.toggle('open',open);
 overlay.classList.toggle('show',open);
 menuToggle.setAttribute('aria-expanded',String(open));
 overlay.setAttribute('aria-hidden',String(!open));
 document.body.style.overflow=open?'hidden':'';
}
menuToggle.addEventListener('click',()=>setMenu(!sidebar.classList.contains('open')));
overlay.addEventListener('click',()=>setMenu(false));
document.addEventListener('keydown',e=>{if(e.key==='Escape')setMenu(false)});
document.querySelectorAll('.side-link').forEach(link=>link.addEventListener('click',()=>setMenu(false)));
document.getElementById('sideLogout').addEventListener('click',async e=>{e.preventDefault();await supabase.auth.signOut();location.href='client-login.html';});
load();
</script>

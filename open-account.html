<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buraq Markets — Open Account</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#050908;color:#f3f4ef;min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:35px 20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:35px}.brand{font-size:25px;font-weight:800;color:#d9a94a}.back{color:#d9a94a;text-decoration:none}.card{max-width:760px;margin:0 auto;background:#0b1210;border:1px solid #26362f;border-radius:18px;padding:35px;box-shadow:0 20px 70px #0008}.eyebrow{text-transform:uppercase;letter-spacing:2px;color:#d9a94a;font-size:12px;font-weight:bold}.title{text-align:center;margin-bottom:30px}.title h1{font-size:38px;margin:10px 0}.title p{color:#9aa49f}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{display:flex;flex-direction:column;gap:8px}.field.full{grid-column:1/-1}label{font-size:13px;color:#b9c0bc}input,select{width:100%;padding:14px 15px;border-radius:9px;border:1px solid #31413a;background:#07100d;color:#fff;outline:none}input:focus,select:focus{border-color:#d9a94a}.submit{margin-top:24px;width:100%;padding:15px;border:0;border-radius:9px;background:#d9a94a;color:#17130b;font-weight:800;font-size:16px;cursor:pointer}.submit:disabled{opacity:.6;cursor:wait}.note{text-align:center;color:#78827d;font-size:12px;margin-top:18px;line-height:1.6}.error{text-align:center;color:#ff8b8b;font-size:12px;margin-top:14px;display:none}@media(max-width:650px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.title h1{font-size:30px}.card{padding:24px}}</style></head>
<body><div class="wrap"><div class="top"><div class="brand">BURAQ MARKETS</div><a class="back" href="index.html">← Back to Home</a></div>
<div class="card"><div class="title"><div class="eyebrow">Trading Account</div><h1>Open Your Account</h1><p>Complete the form below to start your account application.</p></div>
<form id="signupForm">
<div class="grid">
<div class="field"><label>Full Name</label><input id="fullName" required placeholder="Enter your full name"></div>
<div class="field"><label>Email Address</label><input id="email" required type="email" placeholder="Enter your email"></div>
<div class="field"><label>Phone Number</label><input id="phone" required type="tel" placeholder="Enter phone number"></div>
<div class="field"><label>Country</label><select id="country" required><option value="">Select country</option><option>Pakistan</option><option>United Arab Emirates</option><option>Saudi Arabia</option><option>United Kingdom</option><option>Other</option></select></div>
<div class="field"><label>Preferred Platform</label><select id="platform" required><option value="">Select platform</option><option>MT4</option><option>MT5</option><option>WebTrader</option></select></div>
<div class="field full"><label>Password</label><input id="password" required minlength="6" type="password" placeholder="Create a password"></div>
</div><button class="submit" id="submitBtn" type="submit">Create Account →</button></form>
<div class="error" id="error"></div><div class="note">Your password is handled securely by Supabase Authentication. By continuing, you agree to the applicable account opening terms and conditions.</div></div></div>
<script type="module">
import { supabase } from './supabase-config.js';
const form=document.getElementById('signupForm'), btn=document.getElementById('submitBtn'), error=document.getElementById('error');
form.addEventListener('submit', async e=>{
  e.preventDefault(); error.style.display='none'; btn.disabled=true; btn.textContent='Creating Account…';
  const values={full_name:fullName.value.trim(),phone:phone.value.trim(),country:country.value,preferred_platform:platform.value};
  const {data,error:authError}=await supabase.auth.signUp({email:email.value.trim(),password:password.value,options:{data:values}});
  if(authError){ error.textContent=authError.message; error.style.display='block'; btn.disabled=false; btn.textContent='Create Account →'; return; }
  sessionStorage.setItem('buraq_signup_email',email.value.trim());
  sessionStorage.setItem('buraq_user_id',data.user?.id||'');
  location.href='account-success.html';
});
</script></body></html>

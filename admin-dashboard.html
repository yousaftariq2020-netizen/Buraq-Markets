<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buraq Markets — Admin Panel</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-dark: #070b0d;
      --card-bg: #11181c;
      --border-color: #202a2e;
      --accent-gold: #d6a93b;
      --text-main: #e1e7e8;
      --text-muted: #8899a6;
      --green: #10b981;
      --red: #ef4444;
    }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo { font-weight: 800; font-size: 20px; color: var(--accent-gold); letter-spacing: 1px; }
    .user-badge { background: #1c262b; padding: 6px 12px; border-radius: 6px; font-size: 13px; color: var(--accent-gold); }
    .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .stat-card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 20px; border-radius: 8px; }
    .stat-title { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
    .stat-value { font-size: 28px; font-weight: 700; color: #fff; }
    .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
    .tab-btn { background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); padding: 10px 20px; border-radius: 6px; cursor: pointer; }
    .tab-btn.active { background: var(--accent-gold); color: #000; font-weight: 600; border-color: var(--accent-gold); }
    .table-container { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
    th { background: #162025; padding: 14px 18px; color: var(--text-muted); border-bottom: 1px solid var(--border-color); }
    td { padding: 14px 18px; border-bottom: 1px solid var(--border-color); color: var(--text-main); }
    .btn { padding: 6px 14px; border-radius: 4px; border: none; font-weight: 600; cursor: pointer; font-size: 12px; margin-right: 5px; }
    .btn-approve { background: var(--green); color: #000; }
    .btn-reject { background: var(--red); color: #fff; }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; }
    .badge-pending { background: #332606; color: var(--accent-gold); }
    .badge-approved { background: #062b1e; color: var(--green); }
    .badge-rejected { background: #380e0e; color: var(--red); }
  </style>
</head>
<body>

  <header>
    <div class="logo">BURAQ ADMIN</div>
    <div>
      <span class="user-badge" id="adminUserEmail">Admin</span>
      <button class="btn btn-reject" onclick="logout()" style="margin-left: 10px;">Logout</button>
    </div>
  </header>

  <div class="container">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-title">Pending Transactions</div>
        <div class="stat-value" id="statPendingCount">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">Pending KYC</div>
        <div class="stat-value" id="statKycCount">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">Total Clients</div>
        <div class="stat-value" id="statClientCount">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">Total Transactions</div>
        <div class="stat-value" id="statTotalCount">0</div>
      </div>
    </div>

    <div class="nav-tabs">
      <button class="tab-btn active" id="tabPending" onclick="loadTab('pending')">Pending Requests</button>
      <button class="tab-btn" id="tabAll" onclick="loadTab('all')">All Transactions</button>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Client Email</th>
            <th>Type</th>
            <th>Reference</th>
            <th>Amount</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="transactionsTableBody">
          <tr><td colspan="7" style="text-align: center;">Loading data...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { sendNotification } from './email-helper.js';

    const SUPABASE_URL = 'https://zlmoqiulzrqpnbxfeetp.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpsbW9xaXVsenJxcG5ieGZlZXRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNjQ1MDcsImV4cCI6MjEwMjc0MDUwN30.QMWUlgJs6I1kYY1jpo0Y9NsfL2XH5mQE3GT8-fDHuAo';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentTab = 'pending';
    let profilesMap = {};

    async function initAdmin() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (user) {
        document.getElementById('adminUserEmail').innerText = user.email;
      }
      fetchData();
    }

    async function fetchData() {
      const { data: profiles } = await supabaseClient.from('profiles').select('id, email, full_name');
      if (profiles) {
        profilesMap = {};
        profiles.forEach(p => {
          profilesMap[p.id] = p;
        });
      }

      const { data: txs, error } = await supabaseClient.from('transactions').select('*');
      if (error) console.error('Fetch Error:', error);

      document.getElementById('statClientCount').innerText = profiles ? profiles.length : 0;

      const allTxs = txs || [];
      const pendingTxs = allTxs.filter(t => (t.status || '').toLowerCase() === 'pending');

      document.getElementById('statPendingCount').innerText = pendingTxs.length;
      document.getElementById('statTotalCount').innerText = allTxs.length;

      const displayTxs = currentTab === 'pending' ? pendingTxs : allTxs;
      renderTable(displayTxs);
    }

    function renderTable(txs) {
      const tbody = document.getElementById('transactionsTableBody');
      if (txs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;">No transactions found.</td></tr>';
        return;
      }

      tbody.innerHTML = txs.map(tx => {
        let rawUser = tx.user_email || tx.email || tx.client_email || tx.user_id || '';
        let clientEmail = 'N/A';
        let clientName = tx.client_name || tx.full_name || 'Valued Trader';

        if (rawUser.includes('@')) {
          clientEmail = rawUser;
        } else if (profilesMap[rawUser]) {
          clientEmail = profilesMap[rawUser].email || 'N/A';
          clientName = profilesMap[rawUser].full_name || clientName;
        }

        const date = tx.created_at ? new Date(tx.created_at).toLocaleString() : '-';
        const statusClean = (tx.status || 'pending').toLowerCase();
        const txAmount = tx.amount || 0;
        const txRef = tx.reference || '-';
        const txType = tx.type || 'Deposit';
        
        return `
          <tr>
            <td>${date}</td>
            <td><strong>${clientEmail}</strong></td>
            <td>${txType}</td>
            <td>${txRef}</td>
            <td style="color: var(--accent-gold); font-weight: bold;">$${txAmount}</td>
            <td><span class="badge badge-${statusClean}">${tx.status}</span></td>
            <td>
              ${statusClean === 'pending' ? `
                <button class="btn btn-approve" onclick="processTx('${tx.id}', '${clientEmail}', '${clientName}', 'approve', '${txAmount}', '${txRef}', '${txType}')">Approve</button>
                <button class="btn btn-reject" onclick="processTx('${tx.id}', '${clientEmail}', '${clientName}', 'reject', '${txAmount}', '${txRef}', '${txType}')">Reject</button>
              ` : 'Done'}
            </td>
          </tr>
        `;
      }).join('');
    }

    window.processTx = async function(id, clientEmail, clientName, action, amount, reference, type) {
      if (!confirm(`Are you sure you want to ${action} this transaction?`)) return;

      const newStatus = action === 'approve' ? 'APPROVED' : 'REJECTED';
      
      const { error } = await supabaseClient
        .from('transactions')
        .update({ status: newStatus })
        .eq('id', id);

      if (error) {
        alert('Database Update Failed: ' + error.message);
        return;
      }

      if (clientEmail && clientEmail.includes('@')) {
        const txDetails = { amount, reference, type };
        const emailSent = await sendNotification(clientEmail, clientName, action, txDetails);
        if (emailSent) {
          alert(`Status ${newStatus} updated & detailed email sent to ${clientEmail}!`);
        } else {
          alert(`Status updated to ${newStatus}, but email failed to send.`);
        }
      } else {
        alert(`Status updated to ${newStatus}. (No valid email linked).`);
      }

      fetchData();
    };

    window.loadTab = function(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = tab === 'pending' ? document.getElementById('tabPending') : document.getElementById('tabAll');
      if (activeBtn) activeBtn.classList.add('active');
      fetchData();
    };

    window.logout = async function() {
      await supabaseClient.auth.signOut();
      window.location.href = 'index.html';
    };

    window.onload = initAdmin;
  </script>
</body>
</html>

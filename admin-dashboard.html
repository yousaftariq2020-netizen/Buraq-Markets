<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buraq Markets — Admin Panel</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080a0c;color:#e1e7ec;font-family:Inter,Arial,sans-serif;padding:20px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}
.brand{font:bold 24px Georgia,serif;color:#f4cf72}
.user-info{display:flex;align-items:center;gap:15px}
.user-email{background:#13181e;padding:8px 14px;border-radius:6px;border:1px solid #232d38;font-size:12px;color:#f4cf72}
.logout-btn{background:#e63946;color:#fff;border:none;padding:9px 16px;border-radius:6px;cursor:pointer;font-weight:bold;font-size:12px}
.logout-btn:hover{background:#c72c38}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-bottom:25px}
.stat-card{background:#11161d;border:1px solid #1f2933;border-radius:10px;padding:20px}
.stat-card .title{font-size:12px;color:#8899a6;margin-bottom:8px;font-weight:600}
.stat-card .value{font-size:28px;font-weight:bold;color:#fff}

.tabs{display:flex;gap:10px;margin-bottom:18px}
.tab-btn{background:#11161d;border:1px solid #1f2933;color:#8899a6;padding:10px 18px;border-radius:8px;cursor:pointer;font-weight:bold;font-size:13px}
.tab-btn.active{background:#f4cf72;color:#080a0c;border-color:#f4cf72}

.table-container{background:#11161d;border:1px solid #1f2933;border-radius:10px;overflow-x:auto}
.data-table{width:100%;border-collapse:collapse;text-align:left;font-size:13px}
.data-table th{background:#161d26;padding:14px 16px;color:#8899a6;font-weight:600;border-bottom:1px solid #1f2933}
.data-table td{padding:14px 16px;border-bottom:1px solid #1b232c;color:#d1d5db}
.data-table tr:last-child td{border-bottom:none}

.status-badge{padding:4px 8px;border-radius:4px;font-size:11px;font-weight:bold;display:inline-block}
.status-pending{background:#3a2e10;color:#f4cf72;border:1px solid #6b521a}
.status-approved{background:#0e3321;color:#4ade80;border:1px solid #166534}
.status-rejected{background:#3b1219;color:#f87171;border:1px solid #991b1b}

.action-btn{padding:6px 12px;border-radius:5px;border:none;font-size:12px;font-weight:bold;cursor:pointer;margin-right:5px}
.approve-btn{background:#10b981;color:#fff}.approve-btn:hover{background:#059669}
.reject-btn{background:#ef4444;color:#fff}.reject-btn:hover{background:#dc2626}
.badge-role{padding:3px 7px;border-radius:4px;font-size:10px;text-transform:uppercase;font-weight:bold}
.role-client{background:#1e293b;color:#94a3b8;border:1px solid #334155}
.role-admin{background:#3b2d12;color:#f4cf72;border:1px solid #785a21}
</style>
</head>
<body>

<div class="header">
  <div class="brand">BURAQ ADMIN</div>
  <div class="user-info">
    <div class="user-email" id="adminEmail">Loading...</div>
    <button class="logout-btn" id="logoutBtn">Logout</button>
  </div>
</div>

<div class="stats-grid">
  <div class="stat-card">
    <div class="title">Pending Transactions</div>
    <div class="value" id="pendingTxCount">0</div>
  </div>
  <div class="stat-card">
    <div class="title">Pending KYC</div>
    <div class="value">0</div>
  </div>
  <div class="stat-card">
    <div class="title">Total Clients</div>
    <div class="value" id="totalClientsCount">0</div>
  </div>
  <div class="stat-card">
    <div class="title">Total Transactions</div>
    <div class="value" id="totalTxCount">0</div>
  </div>
</div>

<div class="tabs">
  <button class="tab-btn active" id="pendingTab">Pending Requests</button>
  <button class="tab-btn" id="allTxTab">All Transactions</button>
  <button class="tab-btn" id="clientsTab">Clients Detail</button>
</div>

<!-- Transactions View -->
<div class="table-container" id="txView">
  <table class="data-table">
    <thead>
      <tr>
        <th>Date</th>
        <th>Client Email</th>
        <th>Type</th>
        <th>Reference</th>
        <th>Amount</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="txTableBody">
      <tr><td colspan="7" style="text-align:center;">Loading data...</td></tr>
    </tbody>
  </table>
</div>

<!-- Clients Detail View -->
<div class="table-container" id="clientsView" style="display:none;">
  <table class="data-table">
    <thead>
      <tr>
        <th>Client Email</th>
        <th>User ID</th>
        <th>Role</th>
        <th>Joined Date</th>
      </tr>
    </thead>
    <tbody id="clientsTableBody">
      <tr><td colspan="4" style="text-align:center;">Loading clients...</td></tr>
    </tbody>
  </table>
</div>

<script type="module">
import { supabase } from './supabase-config.js';
import { triggerEmail } from './email-helper.js';

let currentTab = 'pending';
let allTransactions = [];

const adminEmailEl = document.getElementById('adminEmail');
const logoutBtn = document.getElementById('logoutBtn');
const txTableBody = document.getElementById('txTableBody');
const clientsTableBody = document.getElementById('clientsTableBody');

const pendingTab = document.getElementById('pendingTab');
const allTxTab = document.getElementById('allTxTab');
const clientsTab = document.getElementById('clientsTab');

const txView = document.getElementById('txView');
const clientsView = document.getElementById('clientsView');

const pendingTxCount = document.getElementById('pendingTxCount');
const totalClientsCount = document.getElementById('totalClientsCount');
const totalTxCount = document.getElementById('totalTxCount');

async function checkAuth() {
  const { data: { user } } = await supabase.auth.getUser();
  if (!user) {
    location.href = 'client-login.html?redirect=admin-dashboard.html';
    return;
  }
  
  const { data: profile } = await supabase.from('profiles').select('role').eq('id', user.id).maybeSingle();
  if (profile?.role !== 'admin') {
    location.href = 'client-dashboard.html';
    return;
  }
  
  adminEmailEl.textContent = user.email;
  loadData();
  loadClientsCount();
}

async function loadClientsCount() {
  const { data } = await supabase.from('profiles').select('id');
  if (data) {
    totalClientsCount.textContent = data.length;
  }
}

async function loadData() {
  const { data, error } = await supabase
    .from('transactions')
    .select('*')
    .order('created_at', { ascending: false });

  if (error) {
    txTableBody.innerHTML = `<tr><td colspan="7" style="text-align:center;color:#ef4444;">Error: ${error.message}</td></tr>`;
    return;
  }

  allTransactions = data || [];
  totalTxCount.textContent = allTransactions.length;
  
  const pendingList = allTransactions.filter(t => (t.status || '').toLowerCase() === 'pending');
  pendingTxCount.textContent = pendingList.length;

  renderTransactions();
}

function renderTransactions() {
  let list = allTransactions;
  if (currentTab === 'pending') {
    list = allTransactions.filter(t => (t.status || '').toLowerCase() === 'pending');
  }

  if (list.length === 0) {
    txTableBody.innerHTML = `<tr><td colspan="7" style="text-align:center;">No transactions found.</td></tr>`;
    return;
  }

  txTableBody.innerHTML = list.map(t => {
    const isPending = (t.status || '').toLowerCase() === 'pending';
    const dateStr = t.created_at ? new Date(t.created_at).toLocaleDateString() : '-';
    let statusClass = 'status-pending';
    if ((t.status || '').toLowerCase() === 'approved') statusClass = 'status-approved';
    if ((t.status || '').toLowerCase() === 'declined' || (t.status || '').toLowerCase() === 'rejected') statusClass = 'status-rejected';

    return `
      <tr>
        <td>${dateStr}</td>
        <td><b>${t.user_email || 'N/A'}</b></td>
        <td>${t.type || 'Deposit'}</td>
        <td>${t.reference || '-'}</td>
        <td style="color:#f4cf72;font-weight:bold;">$${t.amount || 0}</td>
        <td><span class="status-badge ${statusClass}">${t.status || 'Pending'}</span></td>
        <td>
          ${isPending ? `
            <button class="action-btn approve-btn" data-id="${t.id}" data-action="approve">Approve</button>
            <button class="action-btn reject-btn" data-id="${t.id}" data-action="reject">Reject</button>
          ` : '-'}
        </td>
      </tr>
    `;
  }).join('');

  document.querySelectorAll('.action-btn').forEach(btn => {
    btn.addEventListener('click', handleAction);
  });
}

async function handleAction(e) {
  const btn = e.target;
  const id = btn.getAttribute('data-id');
  const action = btn.getAttribute('data-action');
  const isApprove = action === 'approve';
  const newStatus = isApprove ? 'Approved' : 'Declined';

  btn.disabled = true;
  btn.textContent = 'Processing...';

  const tx = allTransactions.find(t => String(t.id) === String(id));

  const { error } = await supabase
    .from('transactions')
    .update({ status: newStatus })
    .eq('id', id);

  if (error) {
    alert('Update failed: ' + error.message);
    btn.disabled = false;
    return;
  }

  if (tx && tx.user_email) {
    await triggerEmail(tx.user_email, 'Valued Trader', action, {
      type: tx.type || 'Deposit',
      amount: tx.amount,
      reference: tx.reference
    });
  }

  loadData();
}

async function loadClientsDetail() {
  clientsTableBody.innerHTML = `<tr><td colspan="4" style="text-align:center;">Loading clients...</td></tr>`;

  const { data: clients, error } = await supabase
    .from('profiles')
    .select('*')
    .order('created_at', { ascending: false });

  if (error || !clients || clients.length === 0) {
    clientsTableBody.innerHTML = `<tr><td colspan="4" style="text-align:center;">No clients found.</td></tr>`;
    return;
  }

  totalClientsCount.textContent = clients.length;

  clientsTableBody.innerHTML = clients.map(c => `
    <tr>
      <td><b>${c.email || 'N/A'}</b></td>
      <td style="font-size:11px;color:#8899a6;">${c.id}</td>
      <td><span class="badge-role ${c.role === 'admin' ? 'role-admin' : 'role-client'}">${c.role || 'client'}</span></td>
      <td>${c.created_at ? new Date(c.created_at).toLocaleDateString() : '-'}</td>
    </tr>
  `).join('');
}

pendingTab.addEventListener('click', () => {
  currentTab = 'pending';
  pendingTab.classList.add('active');
  allTxTab.classList.remove('active');
  clientsTab.classList.remove('active');
  txView.style.display = 'block';
  clientsView.style.display = 'none';
  renderTransactions();
});

allTxTab.addEventListener('click', () => {
  currentTab = 'all';
  pendingTab.classList.remove('active');
  allTxTab.classList.add('active');
  clientsTab.classList.remove('active');
  txView.style.display = 'block';
  clientsView.style.display = 'none';
  renderTransactions();
});

clientsTab.addEventListener('click', () => {
  pendingTab.classList.remove('active');
  allTxTab.classList.remove('active');
  clientsTab.classList.add('active');
  txView.style.display = 'none';
  clientsView.style.display = 'block';
  loadClientsDetail();
});

logoutBtn.addEventListener('click', async () => {
  await supabase.auth.signOut();
  location.href = 'client-login.html';
});

checkAuth();
</script>
</body>
</html>

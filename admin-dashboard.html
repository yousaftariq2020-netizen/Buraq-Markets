<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buraq Admin Dashboard | Forex Broker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body { background: #0a0a0a; }
    .glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(12px); }
    .nav-link { transition: all 0.3s; }
    .nav-link:hover { transform: translateX(8px); }
    .table-row { transition: all 0.3s; }
    .table-row:hover { background-color: #1f1f1f; }
  </style>
</head>
<body class="text-white">

<div class="flex h-screen">
  <!-- Sidebar -->
  <div class="w-72 bg-zinc-950 border-r border-zinc-800 flex flex-col">
    <div class="p-6 border-b border-zinc-800">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-cyan-400 rounded-2xl flex items-center justify-center text-2xl font-bold">B</div>
        <div>
          <h1 class="text-2xl font-bold tracking-tighter">Buraq</h1>
          <p class="text-xs text-zinc-500 -mt-1">Forex Broker</p>
        </div>
      </div>
    </div>

    <nav class="flex-1 p-4 space-y-1">
      <a href="#" class="nav-link flex items-center gap-3 px-4 py-3 text-lg font-medium rounded-2xl bg-blue-600 text-white">
        <i class="fas fa-tachometer-alt"></i> Dashboard
      </a>
      <a href="#" class="nav-link flex items-center gap-3 px-4 py-3 text-lg font-medium rounded-2xl hover:bg-zinc-900">
        <i class="fas fa-users"></i> Users
      </a>
      <a href="#" class="nav-link flex items-center gap-3 px-4 py-3 text-lg font-medium rounded-2xl hover:bg-zinc-900">
        <i class="fas fa-file-invoice"></i> Transactions
      </a>
      <a href="#" class="nav-link flex items-center gap-3 px-4 py-3 text-lg font-medium rounded-2xl hover:bg-zinc-900">
        <i class="fas fa-exchange-alt"></i> Open Trades
      </a>
      <a href="#" class="nav-link flex items-center gap-3 px-4 py-3 text-lg font-medium rounded-2xl hover:bg-zinc-900">
        <i class="fas fa-chart-line"></i> Reports
      </a>
      <a href="#" class="nav-link flex items-center gap-3 px-4 py-3 text-lg font-medium rounded-2xl hover:bg-zinc-900">
        <i class="fas fa-cog"></i> Settings
      </a>
    </nav>

    <div class="p-4 border-t border-zinc-800">
      <button onclick="logout()" class="w-full flex items-center justify-center gap-3 py-3 bg-red-600 hover:bg-red-700 rounded-2xl font-medium">
        <i class="fas fa-sign-out-alt"></i> Logout
      </button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col">
    <!-- Top Bar -->
    <div class="h-16 bg-zinc-950 border-b border-zinc-800 flex items-center px-8 justify-between">
      <div class="flex-1">
        <input type="text" id="search" placeholder="Search user ID, reference or amount..." 
               class="w-96 bg-zinc-900 border border-zinc-700 rounded-3xl px-6 py-3 focus:outline-none focus:border-blue-500">
      </div>
      <div class="flex items-center gap-6">
        <button class="text-2xl"><i class="fas fa-bell"></i></button>
        <div class="flex items-center gap-3">
          <div class="text-right">
            <p class="font-medium">Admin User</p>
            <p class="text-xs text-green-500">Online</p>
          </div>
          <div class="w-9 h-9 bg-gradient-to-br from-blue-500 to-cyan-400 rounded-2xl"></div>
        </div>
      </div>
    </div>

    <!-- Dashboard Content -->
    <div class="flex-1 p-8 overflow-auto">
      <h1 class="text-4xl font-bold mb-8">Admin Dashboard</h1>

      <!-- Stats Cards -->
      <div class="grid grid-cols-4 gap-6 mb-10">
        <div class="glass border border-zinc-700 rounded-3xl p-6">
          <div class="flex justify-between">
            <div>
              <p class="text-sm text-zinc-400">Total Users</p>
              <p class="text-5xl font-bold mt-2">1,284</p>
            </div>
            <i class="fas fa-users text-5xl text-blue-500 opacity-20"></i>
          </div>
        </div>
        <div class="glass border border-zinc-700 rounded-3xl p-6">
          <div class="flex justify-between">
            <div>
              <p class="text-sm text-zinc-400">Total Volume</p>
              <p class="text-5xl font-bold mt-2 text-green-400">$12.4M</p>
            </div>
            <i class="fas fa-dollar-sign text-5xl text-green-500 opacity-20"></i>
          </div>
        </div>
        <div class="glass border border-zinc-700 rounded-3xl p-6">
          <div class="flex justify-between">
            <div>
              <p class="text-sm text-zinc-400">Pending Requests</p>
              <p class="text-5xl font-bold mt-2 text-yellow-400">47</p>
            </div>
            <i class="fas fa-clock text-5xl text-yellow-500 opacity-20"></i>
          </div>
        </div>
        <div class="glass border border-zinc-700 rounded-3xl p-6">
          <div class="flex justify-between">
            <div>
              <p class="text-sm text-zinc-400">Today's P&L</p>
              <p class="text-5xl font-bold mt-2 text-red-400">-$8,234</p>
            </div>
            <i class="fas fa-chart-line text-5xl text-red-500 opacity-20"></i>
          </div>
        </div>
      </div>

      <!-- Main Table -->
      <div class="glass border border-zinc-700 rounded-3xl overflow-hidden">
        <div class="px-8 py-6 border-b border-zinc-700 flex justify-between items-center">
          <h2 class="text-2xl font-semibold">Recent Transactions</h2>
          <button onclick="approveAll()" class="px-6 py-2 bg-green-600 hover:bg-green-700 rounded-2xl text-sm font-medium">Approve All Pending</button>
        </div>

        <table class="w-full">
          <thead>
            <tr class="text-left text-xs uppercase tracking-widest text-zinc-400 border-b border-zinc-700">
              <th class="px-8 py-5">Date</th>
              <th class="px-8 py-5">User ID</th>
              <th class="px-8 py-5">Type</th>
              <th class="px-8 py-5">Reference</th>
              <th class="px-8 py-5">Amount</th>
              <th class="px-8 py-5">Status</th>
              <th class="px-8 py-5">Actions</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="text-sm">
            <!-- JS will populate this -->
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  // Sample data
  const transactions = [
    { date: "21/08/2025", user: "USR12345", type: "Deposit", ref: "TXN-98765", amount: "+$5,000", proof: "No proof", status: "pending", action: "Approve/Reject" },
    { date: "20/08/2025", user: "USR54321", type: "Withdrawal", ref: "TXN-87654", amount: "+$2,500", proof: "View Proof", status: "approved", action: "Approve/Reject" },
    { date: "19/08/2025", user: "USR11111", type: "Deposit", ref: "TXN-55555", amount: "+$15,000", proof: "No proof", status: "rejected", action: "Approve/Reject" },
  ];

  function renderTable() {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';
    transactions.forEach((t, index) => {
      const row = document.createElement('tr');
      row.className = 'table-row border-b border-zinc-800 hover:bg-zinc-900';
      row.innerHTML = `
        <td class="px-8 py-5">${t.date}</td>
        <td class="px-8 py-5 font-medium">${t.user}</td>
        <td class="px-8 py-5">${t.type}</td>
        <td class="px-8 py-5 text-blue-400">${t.ref}</td>
        <td class="px-8 py-5">${t.amount}</td>
        <td class="px-8 py-5">
          <span class="px-4 py-1 rounded-3xl text-xs font-medium ${t.status === 'pending' ? 'bg-yellow-500/20 text-yellow-400' : t.status === 'approved' ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400'}">
            ${t.status}
          </span>
        </td>
        <td class="px-8 py-5">
          ${t.status === 'pending' ? `
            <button onclick="approveTransaction(${index})" class="px-6 py-2 bg-green-600 hover:bg-green-700 rounded-2xl text-sm">Approve</button>
            <button onclick="rejectTransaction(${index})" class="ml-3 px-6 py-2 bg-red-600 hover:bg-red-700 rounded-2xl text-sm">Reject</button>
          ` : ''}
        </td>
      `;
      tbody.appendChild(row);
    });
  }

  function approveTransaction(i) {
    alert(`Transaction ${transactions[i].ref} Approved!`);
    transactions.splice(i, 1); // demo remove
    renderTable();
  }

  function rejectTransaction(i) {
    alert(`Transaction ${transactions[i].ref} Rejected!`);
    transactions.splice(i, 1);
    renderTable();
  }

  function approveAll() {
    alert("All Pending Transactions Approved!");
    renderTable();
  }

  function logout() {
    if (confirm("Logout?")) location.reload();
  }

  // Init
  window.onload = () => {
    renderTable();
  };
</script>
</body>
</html>

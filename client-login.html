<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buraq Markets — Portal Login</title>
<style>
:root{--bg:#070b0d;--panel:#10171b;--border:#202a2e;--text:#f4f7f6;--muted:#8d999d;--gold:#d6a93b}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% 10%,#211b0b 0,transparent 40%),var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;display:grid;place-items:center;min-height:100vh;padding:20px}
.login-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:32px;width:100%;max-width:400px;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
.logo{display:block;width:160px;margin:0 auto 24px}
h2{margin:0 0 8px;text-align:center;font-size:22px}
p{margin:0 0 24px;text-align:center;color:var(--muted);font-size:13px}
.form-group{margin-bottom:16px}
label{display:block;font-size:12px;margin-bottom:6px;color:var(--muted)}
input{width:100%;background:#0a0f12;border:1px solid var(--border);color:var(--text);padding:12px;border-radius:8px;font-size:14px;outline:none}
input:focus{border-color:var(--gold)}
button{width:100%;background:var(--gold);color:#000;border:none;padding:12px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;margin-top:8px}
button:hover{opacity:0.9}
.error{background:#2a1113;border:1px solid #5a1d22;color:#ff6d77;padding:10px;border-radius:6px;font-size:12px;margin-bottom:16px;display:none}
</style>
</head>
<body>
<div class="login-card">
  <img src="buraq-logo.jpg" alt="Buraq Markets" class="logo">
  <h2>Sign In to Portal</h2>
  <p>Enter your credentials to access portal area</p>
  
  <div id="errorBox" class="error"></div>

  <form id="loginForm">
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" required placeholder="name@example.com">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" required placeholder="••••••••">
    </div>
    <button type="submit" id="submitBtn">Sign In</button>
  </form>
</div>

<script type="module">
import { supabase } from './supabase-config.js';

// Auto Role-based Redirect Logic
async function handleUserRedirect(user) {
  if (!user) return;

  // Check user role from profiles table
  const { data: profile } = await supabase
    .from('profiles')
    .select('role')
    .eq('id', user.id)
    .maybeSingle();

  // Redirect based on exact role
  if (profile?.role === 'admin') {
    window.location.href = 'admin-dashboard.html';
  } else {
    window.location.href = 'client-dashboard.html';
  }
}

// 1. Initial Check on Page Load
const { data: { user } } = await supabase.auth.getUser();
if (user) {
  await handleUserRedirect(user);
}

const loginForm = document.getElementById('loginForm');
const errorBox = document.getElementById('errorBox');
const submitBtn = document.getElementById('submitBtn');

// 2. Form Submit Handler
loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.style.display = 'none';
  submitBtn.textContent = 'Authenticating...';
  submitBtn.disabled = true;

  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  const { data, error } = await supabase.auth.signInWithPassword({ email, password });

  if (error) {
    errorBox.textContent = error.message;
    errorBox.style.display = 'block';
    submitBtn.textContent = 'Sign In';
    submitBtn.disabled = false;
  } else {
    // Redirect user to their respective dashboard
    await handleUserRedirect(data.user);
  }
});
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buraq Markets — Client Login</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#070707;color:#fff;font-family:Inter,Arial,sans-serif;display:grid;place-items:center}
.box{width:min(420px,calc(100% - 30px));background:#15151b;border:1px solid #5b4725;border-radius:14px;padding:35px}
.brand{font:bold 23px Georgia,serif;color:#f4cf72}
.eyebrow{color:#f4cf72;font-size:11px;letter-spacing:3px;margin-top:25px;font-weight:700}
.box h1{font:normal 30px Georgia,serif;margin:10px 0 8px}
.sub{color:#aaa;font-size:12px;margin:0 0 18px}
.field{margin:15px 0}
.field label{display:block;font-size:11px;font-weight:700;margin-bottom:7px}
.field input{width:100%;padding:13px;background:#09090c;border:1px solid #36353c;border-radius:7px;color:#fff;outline:0}
.field input:focus{border-color:#d6a93b}
.password-wrapper{position:relative;width:100%}
.password-wrapper input{padding-right:40px}
.toggle-password{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;user-select:none;font-size:16px;opacity:0.7}
.toggle-password:hover{opacity:1}
.row-between{display:flex;justify-content:flex-end;margin:-6px 0 10px}
.row-between a{color:#f4cf72;font-size:12px;text-decoration:none}
.row-between a:hover{text-decoration:underline}
.btn{width:100%;padding:13px;background:linear-gradient(#f4cc6c,#dca83c);border:0;border-radius:7px;font-weight:700;cursor:pointer;font-size:14px}
.btn:disabled{opacity:.6}
.back{display:block;text-align:center;margin-top:18px;color:#aaa;font-size:11px;text-decoration:none}
.back:hover{color:#f4cf72}
.error{color:#ff8b8b;font-size:12px;margin:12px 0;display:none}
</style>
</head>
<body>
<div class="box">
  <div class="brand">BURAQ MARKETS</div>
  <div class="eyebrow">SECURE TRADING PORTAL</div>
  <h1>Client Login</h1>
  <p class="sub">Sign in to access your client dashboard.</p>
  <form id="loginForm">
    <div class="field">
      <label>Email</label>
      <input id="email" required type="email" placeholder="Enter your email">
    </div>
    <div class="field">
      <label>Password</label>
      <div class="password-wrapper">
        <input id="password" required type="password" placeholder="Enter your password">
        <span class="toggle-password" id="togglePassword">👁️</span>
      </div>
    </div>
    <div class="row-between">
      <a href="forgot-password.html">Forgot Password?</a>
    </div>
    <div class="error" id="error"></div>
    <button class="btn" id="loginBtn" type="submit">Login to Client Area →</button>
  </form>
  <a class="back" href="index.html">← Back to Buraq Markets</a>
</div>
<script type="module">
import { supabase } from './supabase-config.js';
import { sendLoginEmail } from './email-helper.js';

const form = document.getElementById('loginForm');
const btn = document.getElementById('loginBtn');
const error = document.getElementById('error');
const passwordInput = document.getElementById('password');
const togglePasswordBtn = document.getElementById('togglePassword');

// Toggle Password Visibility
togglePasswordBtn.addEventListener('click', () => {
  if (passwordInput.type === 'password') {
    passwordInput.type = 'text';
    togglePasswordBtn.textContent = '🙈';
  } else {
    passwordInput.type = 'password';
    togglePasswordBtn.textContent = '👁️';
  }
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  error.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Signing In…';
  const { data: signInData, error: err } = await supabase.auth.signInWithPassword({
    email: email.value.trim(),
    password: password.value
  });
  
  if (err) {
    error.textContent = err.message;
    error.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Login to Client Area →';
    return;
  }

  const userId = signInData?.user?.id;
  const userEmail = signInData?.user?.email;
  const userName = signInData?.user?.user_metadata?.full_name || 'Valued Trader';

  // Send Security Login Email
  if (userEmail) {
    sendLoginEmail(userEmail, userName);
  }

  const params = new URLSearchParams(location.search);
  const redirectParam = params.get('redirect');
  let destination = 'client-dashboard.html';

  if (userId) {
    const { data: profile } = await supabase.from('profiles').select('role').eq('id', userId).maybeSingle();
    if (profile?.role === 'admin') {
      destination = (redirectParam === 'admin-dashboard.html') ? redirectParam : 'admin-dashboard.html';
    }
  }
  location.href = destination;
});
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buraq Markets — Portal Login</title>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
:root{--bg:#070b0d;--panel:#10171b;--border:#202a2e;--text:#f4f7f6;--muted:#8d999d;--gold:#d6a93b}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% 10%,#211b0b 0,transparent 40%),var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;display:grid;place-items:center;min-height:100vh;padding:20px}
.login-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:32px;width:100%;max-width:400px;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
.logo{display:block;width:280px;max-width:100%;margin:0 auto 20px}
h2{margin:0 0 8px;text-align:center;font-size:22px}
p{margin:0 0 24px;text-align:center;color:var(--muted);font-size:13px}
.form-group{margin-bottom:16px}
.label-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
label{font-size:12px;color:var(--muted)}
.forgot-link{font-size:12px;color:var(--gold);text-decoration:none}
.forgot-link:hover{text-decoration:underline}
.password-wrapper{position:relative;display:flex;align-items:center}
input{width:100%;background:#0a0f12;border:1px solid var(--border);color:var(--text);padding:12px;border-radius:8px;font-size:14px;outline:none}
.password-wrapper input{padding-right:40px}
input:focus{border-color:var(--gold)}
.toggle-password{position:absolute;right:12px;background:none;border:none;color:var(--muted);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;width:auto;margin:0}
.toggle-password:hover{color:var(--gold);opacity:1}
.toggle-password svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button[type="submit"]{width:100%;background:var(--gold);color:#000;border:none;padding:12px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;margin-top:8px}
button[type="submit"]:hover{opacity:0.9}
.back-home{display:block;text-align:center;margin-top:20px;color:var(--muted);text-decoration:none;font-size:13px;transition:color 0.2s}
.back-home:hover{color:var(--gold)}
.error{background:#2a1113;border:1px solid #5a1d22;color:#ff6d77;padding:10px;border-radius:6px;font-size:12px;margin-bottom:16px;display:none}
</style>
</head>
<body>
<div class="login-card">
  <img src="buraq-logo.png" alt="Buraq Markets" class="logo">
  <h2>Sign In to Portal</h2>
  <p>Enter your credentials to access portal area</p>
  
  <div id="errorBox" class="error"></div>

  <form id="loginForm">
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" required placeholder="name@example.com">
    </div>
    <div class="form-group">
      <div class="label-row">
        <label>Password</label>
        <a href="forgot-password.html" class="forgot-link">Forgot Password?</a>
      </div>
      <div class="password-wrapper">
        <input type="password" id="password" required placeholder="••••••••">
        <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
          <svg id="eyeIcon" viewBox="0 0 24 24">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>
    </div>
    <button type="submit" id="submitBtn">Sign In</button>
  </form>

  <a href="index.html" class="back-home">← Back to Home Page</a>
</div>

<script type="module">
import { supabase } from './supabase-config.js';

// EmailJS setup
emailjs.init({ publicKey: 'srCNMfHCpU7OtJ4hJ' });

const EMAILJS_SERVICE_ID = 'service_94w4z5q';
const EMAILJS_LOGIN_TEMPLATE_ID = 'template_5mlh8in';

// Sends the "Welcome" login-notification email. Never blocks or breaks
// login if EmailJS fails — it just logs the error to the console.
function sendLoginEmail(email){
  const loginTime = new Date().toLocaleString('en-US', {
    dateStyle: 'medium',
    timeStyle: 'short'
  });

  emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_LOGIN_TEMPLATE_ID, {
    to_email: email,
    to_name: email,
    login_time: loginTime
  }).catch((err) => {
    console.error('Login email failed to send:', err);
  });
}

// Password Show/Hide Toggle Logic
const togglePasswordBtn = document.getElementById('togglePassword');
const passwordInput = document.getElementById('password');
const eyeIcon = document.getElementById('eyeIcon');

togglePasswordBtn.addEventListener('click', () => {
  const isPassword = passwordInput.type === 'password';
  passwordInput.type = isPassword ? 'text' : 'password';
  
  if (isPassword) {
    eyeIcon.innerHTML = `
      <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
      <line x1="1" y1="1" x2="23" y2="23"></line>
    `;
  } else {
    eyeIcon.innerHTML = `
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
      <circle cx="12" cy="12" r="3"></circle>
    `;
  }
});

// Auto Role-based Redirect Logic
async function handleUserRedirect(user) {
  if (!user) return;

  const { data: profile } = await supabase
    .from('profiles')
    .select('role')
    .eq('id', user.id)
    .maybeSingle();

  if (profile?.role === 'admin') {
    window.location.href = 'admin-dashboard.html';
  } else {
    window.location.href = 'client-dashboard.html';
  }
}

// 1. Initial Check on Page Load
const { data: { user } } = await supabase.auth.getUser();
if (user) {
  await handleUserRedirect(user);
}

const loginForm = document.getElementById('loginForm');
const errorBox = document.getElementById('errorBox');
const submitBtn = document.getElementById('submitBtn');

// 2. Form Submit Handler
loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.style.display = 'none';
  submitBtn.textContent = 'Authenticating...';
  submitBtn.disabled = true;

  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  const { data, error } = await supabase.auth.signInWithPassword({ email, password });

  if (error) {
    errorBox.textContent = error.message;
    errorBox.style.display = 'block';
    submitBtn.textContent = 'Sign In';
    submitBtn.disabled = false;
  } else {
    sendLoginEmail(email);
    await handleUserRedirect(data.user);
  }
});
</script>
</body>
</html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buraq Markets — Client Login</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#070707;color:#fff;font-family:Arial;display:grid;place-items:center}.box{width:min(420px,calc(100% - 30px));background:#15151b;border:1px solid #5b4725;border-radius:14px;padding:35px}.brand{font:bold 23px Georgia;color:#f4cf72}.eyebrow{color:#f4cf72;font-size:11px;letter-spacing:3px;margin-top:25px}.box h1{font:normal 30px Georgia}.sub{color:#aaa;font-size:12px}.field{margin:15px 0}.field label{display:block;font-size:11px;font-weight:bold;margin-bottom:7px}.field input{width:100%;padding:13px;background:#09090c;border:1px solid #36353c;border-radius:7px;color:#fff}.btn{width:100%;padding:13px;background:linear-gradient(#f4cc6c,#dca83c);border:0;border-radius:7px;font-weight:bold;cursor:pointer}.btn:disabled{opacity:.6}.back{display:block;text-align:center;margin-top:18px;color:#aaa;font-size:11px}.error{color:#ff8b8b;font-size:12px;margin:12px 0;display:none}</style></head>
<body><div class="box"><div class="brand">BURAQ MARKETS</div><div class="eyebrow">SECURE TRADING PORTAL</div><h1>Client Login</h1><p class="sub">Sign in to access your client dashboard.</p>
<form id="loginForm"><div class="field"><label>Email</label><input id="email" required type="email" placeholder="Enter your email"></div><div class="field"><label>Password</label><input id="password" required type="password" placeholder="Enter your password"></div><div class="error" id="error"></div><button class="btn" id="loginBtn">Login to Client Area →</button></form><a class="back" href="index.html">← Back to Buraq Markets</a></div>
<script type="module">
import { supabase } from './supabase-config.js';
const form=document.getElementById('loginForm'),btn=document.getElementById('loginBtn'),error=document.getElementById('error');
form.addEventListener('submit',async e=>{e.preventDefault();error.style.display='none';btn.disabled=true;btn.textContent='Signing In…';const {error:err}=await supabase.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(err){error.textContent=err.message;error.style.display='block';btn.disabled=false;btn.textContent='Login to Client Area →';return;}location.href='client-dashboard.html';});
</script></body></html>
